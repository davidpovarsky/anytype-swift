name: Real OS27 native and iPhone iPad UI smoke

on:
  workflow_call:
    inputs:
      ui_scope:
        type: string
        default: FULL_SMOKE
      runtime_profile:
        description: Explicit Heart runtime identity; no automatic fallback between variants
        type: string
        default: r14
      heart_source_run_id:
        type: string
        required: true
      acceptance_lane:
        description: Existing lane, SDK06, or reviewed Release and coherent T5 preset
        type: string
        default: ''
      acceptance_device:
        type: string
        default: ipad
      acceptance_language:
        type: string
        default: en

permissions:
  contents: read
  actions: read

jobs:
  actual-native-and-ui:
    runs-on: ${{ fromJSON(inputs.acceptance_lane == 'coherent-heart-release' && '["self-hosted", "macOS", "ARM64", "pinkha-scaleway-mac"]' || '["xcode-27"]') }}
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: ${{ inputs.acceptance_lane == 'coherent-heart-release' && '/Applications/Xcode.app/Contents/Developer' || '/Applications/Xcode_27.app/Contents/Developer' }}
      UI27_SCOPE: ${{ inputs.ui_scope }}
      UI27_ACCEPTANCE_LANE: ${{ inputs.acceptance_lane }}
      UI27_DEVICE_FAMILY: ${{ inputs.acceptance_device }}
      UI27_LANGUAGE: ${{ inputs.acceptance_language }}
      HEART_RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      HEART_SOURCE_RUN_ID: ${{ inputs.heart_source_run_id }}
      UI27_CACHE_NAMESPACE: ${{ inputs.acceptance_lane == 'coherent-heart-release' && 'pinkha-ui27-coherent-compiled-v1' || 'pinkha-ui27-compiled-v2' }}
      UI27_CACHE_CONFIGURATION: ${{ ((inputs.acceptance_lane == 'hanlin-native' || (inputs.acceptance_lane == 'hanlin-native-text-ack' || inputs.acceptance_lane == 'hanlin-native-shared-editor')) || inputs.acceptance_lane == 'hanlin-selection') && 'Debug-Anytype' || 'Release-Anytype' }}
    steps:
      - name: Checkout exact integration source
        uses: actions/checkout@v4
      - name: Select compatible native ARM64 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Checkout the immutable canonical Hanlin source
        uses: actions/checkout@v4
        with:
          repository: davidpovarsky/hanlin-ai
          ref: 116cc6be0654a5d11bc56ba00e0310031107ee36
          path: .ci/hanlin-source
          persist-credentials: false
      - name: Prepare the exact SDK before resolving the integrated application
        run: |
          python3 Tools/Hanlin/prepare_sdk.py --source .ci/hanlin-source
          python3 Tools/Hanlin/prepare_sdk.py --check
          mkdir -p build/ui27-evidence
          cp Dependencies/Hanlin/.pinkha-source.json build/ui27-evidence/hanlin-snapshot.json
      - name: Check actual SDK06 process and native receipt rejection controls
        if: ${{ (inputs.acceptance_lane == 'hanlin-native' || (inputs.acceptance_lane == 'hanlin-native-text-ack' || inputs.acceptance_lane == 'hanlin-native-shared-editor')) }}
        run: |
          python3 -B Tools/PinkhaSimulatorGate/test_hanlin_ui_runtime.py -v > build/ui27-evidence/hanlin-runtime-controller-controls.log 2>&1
          python3 -B Tools/PinkhaSimulatorGate/test_hanlin_acceptance_evidence.py -v >> build/ui27-evidence/hanlin-runtime-controller-controls.log 2>&1
      - name: Check the seven new acknowledgement selection controls
        if: ${{ (inputs.acceptance_lane == 'hanlin-native-text-ack' || inputs.acceptance_lane == 'hanlin-native-shared-editor') }}
        run: python3 -B Tools/PinkhaSimulatorGate/test_text_native_ack.py -v
      - name: Check existing-build shared-editor product and result binding
        if: ${{ inputs.acceptance_lane == 'hanlin-native-shared-editor' }}
        run: |
          python3 -B Tools/PinkhaSimulatorGate/test_shared_editor_existing_build.py -v
          python3 -B Tools/PinkhaNativeDerived/test_acceptance_continuation_branch.py -v
      - name: Check coherent same-build selection identity and cleanup controls
        if: ${{ inputs.acceptance_lane == 'coherent-heart-release' }}
        run: |
          python3 -B Tools/PinkhaSimulatorGate/test_coherent_heart_release.py -v
          python3 -B Tools/PinkhaSimulatorGate/test_t5_remaining_freshness.py -v
      - name: Verify actual Xcode27 and create disposable OS27 iPhone and iPad
        run: python3 Tools/PinkhaSimulatorGate/preflight.py --evidence build/ui27-evidence/preflight
      - name: Install the explicitly selected original verified runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B Tools/PinkhaNativeDerived/download_heart_runtime.py \
            --runtime-profile "$HEART_RUNTIME_PROFILE" --source-run-id "$HEART_SOURCE_RUN_ID" \
            --app-source "$GITHUB_WORKSPACE" --expected-app-branch "$GITHUB_REF_NAME" \
            --work "build/ui27-heart-${{ github.run_id }}-${{ github.run_attempt }}" \
            --evidence build/ui27-evidence/heart
      - name: Restore compatible compilation cache without indexing state
        id: ui27-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/ui27-derived/Build
            build/ui27-derived/SourcePackages
            build/ui27-derived/ModuleCache.noindex
            build/ui27-derived/SDKStatCaches.noindex
            build/ui27-derived/SDKExplicitPrecompiledModules
            build/ui27-derived/CompilationCache.noindex
            build/ui27-derived/info.plist
            build/ui27-derived-ui/Build
            build/ui27-derived-ui/ModuleCache.noindex
          key: ${{ env.UI27_CACHE_NAMESPACE }}-arm64-xcode27.0-${{ env.UI27_CACHE_CONFIGURATION }}-${{ hashFiles('Modules/PinkhaKit/Package.swift', 'Anytype.xcodeproj/project.pbxproj', 'Anytype.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Tools/Hanlin/source.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.UI27_CACHE_NAMESPACE }}-arm64-xcode27.0-${{ env.UI27_CACHE_CONFIGURATION }}-${{ hashFiles('Modules/PinkhaKit/Package.swift', 'Anytype.xcodeproj/project.pbxproj', 'Anytype.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Tools/Hanlin/source.json') }}-
            pinkha-ui27-compiled-v2-arm64-xcode27.0-${{ env.UI27_CACHE_CONFIGURATION }}-${{ hashFiles('Modules/PinkhaKit/Package.swift', 'Anytype.xcodeproj/project.pbxproj', 'Anytype.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Tools/Hanlin/source.json') }}-
      - name: Reuse the preceding cache layout only when no v2 cache matched
        if: ${{ steps.ui27-cache.outputs.cache-matched-key == '' }}
        id: ui27-cache-legacy
        uses: actions/cache/restore@v4
        with:
          path: build/ui27-derived
          key: pinkha-ui27-arm64-xcode27.0-${{ ((inputs.acceptance_lane == 'hanlin-native' || (inputs.acceptance_lane == 'hanlin-native-text-ack' || inputs.acceptance_lane == 'hanlin-native-shared-editor')) || inputs.acceptance_lane == 'hanlin-selection') && 'Debug-Anytype' || 'Release-Anytype' }}-${{ hashFiles('Modules/PinkhaKit/Package.swift', 'Anytype.xcodeproj/project.pbxproj', 'Anytype.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Tools/Hanlin/source.json') }}-${{ github.sha }}
          restore-keys: |
            pinkha-ui27-arm64-xcode27.0-${{ ((inputs.acceptance_lane == 'hanlin-native' || (inputs.acceptance_lane == 'hanlin-native-text-ack' || inputs.acceptance_lane == 'hanlin-native-shared-editor')) || inputs.acceptance_lane == 'hanlin-selection') && 'Debug-Anytype' || 'Release-Anytype' }}-${{ hashFiles('Modules/PinkhaKit/Package.swift', 'Anytype.xcodeproj/project.pbxproj', 'Anytype.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Tools/Hanlin/source.json') }}-
      - name: Build once and execute the declared native and UI selection
        if: ${{ inputs.acceptance_lane == '' }}
        id: actual-execution
        timeout-minutes: 105
        run: |
          python3 Tools/PinkhaSimulatorGate/run_ui27.py --app "$GITHUB_WORKSPACE" \
            --evidence build/ui27-evidence --derived build/ui27-derived --ui-scope "$UI27_SCOPE" \
            --runtime-profile "$HEART_RUNTIME_PROFILE" --heart-source-run-id "$HEART_SOURCE_RUN_ID"
      - name: Execute the selected existing Wave-15 lane or reviewed batch preset
        if: ${{ inputs.acceptance_lane != '' }}
        id: wave15-execution
        timeout-minutes: 120
        run: |
          controller=Tools/PinkhaSimulatorGate/run_wave15_acceptance.py
          if [ "$UI27_ACCEPTANCE_LANE" = "hanlin-native-shared-editor" ]; then
            controller=Tools/PinkhaSimulatorGate/run_owned_single_lane.py
          fi
          python3 "$controller" --app "$GITHUB_WORKSPACE" \
            --evidence build/ui27-evidence --derived build/ui27-derived \
            --lane "$UI27_ACCEPTANCE_LANE" --device "$UI27_DEVICE_FAMILY" --language "$UI27_LANGUAGE" \
            --runtime-profile "$HEART_RUNTIME_PROFILE" --heart-source-run-id "$HEART_SOURCE_RUN_ID"
      - name: Package actual logs screenshots xcresult even on failure
        if: always()
        run: python3 Tools/PinkhaNativeDerived/package_evidence.py build/ui27-evidence
      - name: Retain real UI evidence remotely
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-UI27-${{ inputs.acceptance_lane || inputs.ui_scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ui27-evidence/Pinkha-Native-Derived-Evidence.zip
          if-no-files-found: error
          retention-days: 14
      - name: Verify owned SDK or coherent workers finished cleanup before caching
        id: ui27-cache-readiness
        if: ${{ always() && (inputs.acceptance_lane == 'hanlin-native-shared-editor' || inputs.acceptance_lane == 'coherent-heart-release') && steps.wave15-execution.outcome != 'skipped' }}
        run: |
          controller=Tools/PinkhaSimulatorGate/run_owned_single_lane.py
          if [ "$UI27_ACCEPTANCE_LANE" = "coherent-heart-release" ]; then
            controller=Tools/PinkhaSimulatorGate/coherent_heart_release.py
          fi
          python3 -B "$controller" --check-cache-ready build/ui27-evidence
      - name: Preserve compatible compilation cache after success or failed tests
        if: ${{ always() && (steps.actual-execution.outcome != 'skipped' || steps.wave15-execution.outcome != 'skipped') && ((inputs.acceptance_lane != 'hanlin-native-shared-editor' && inputs.acceptance_lane != 'coherent-heart-release') || steps.ui27-cache-readiness.outcome == 'success') && steps.ui27-cache.outputs.cache-hit != 'true' && hashFiles('build/ui27-derived/Build/PinkhaSourceInputs.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            build/ui27-derived/Build
            build/ui27-derived/SourcePackages
            build/ui27-derived/ModuleCache.noindex
            build/ui27-derived/SDKStatCaches.noindex
            build/ui27-derived/SDKExplicitPrecompiledModules
            build/ui27-derived/CompilationCache.noindex
            build/ui27-derived/info.plist
            build/ui27-derived-ui/Build
            build/ui27-derived-ui/ModuleCache.noindex
          key: ${{ steps.ui27-cache.outputs.cache-primary-key }}
