name: Real OS27 native and iPhone iPad UI smoke

on:
  workflow_call:
    inputs:
      ui_scope:
        type: string
        default: FULL_SMOKE
      heart_source_run_id:
        type: string
        required: true
      acceptance_lane:
        description: Existing lane or reviewed remaining-release/retained-heart-release preset
        type: string
        default: ''
      acceptance_device:
        type: string
        default: ipad
      acceptance_language:
        type: string
        default: en

permissions:
  contents: read
  actions: read

jobs:
  actual-native-and-ui:
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      UI27_SCOPE: ${{ inputs.ui_scope }}
      UI27_ACCEPTANCE_LANE: ${{ inputs.acceptance_lane }}
      UI27_DEVICE_FAMILY: ${{ inputs.acceptance_device }}
      UI27_LANGUAGE: ${{ inputs.acceptance_language }}
    steps:
      - name: Checkout exact integration source
        uses: actions/checkout@v4
      - name: Select compatible native ARM64 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Checkout the immutable canonical Hanlin source
        uses: actions/checkout@v4
        with:
          repository: davidpovarsky/hanlin-ai
          ref: 116cc6be0654a5d11bc56ba00e0310031107ee36
          path: .ci/hanlin-source
          persist-credentials: false
      - name: Prepare the exact SDK before resolving the integrated application
        run: |
          python3 Tools/Hanlin/prepare_sdk.py --source .ci/hanlin-source
          python3 Tools/Hanlin/prepare_sdk.py --check
          mkdir -p build/ui27-evidence
          cp Dependencies/Hanlin/.pinkha-source.json build/ui27-evidence/hanlin-snapshot.json
      - name: Check actual SDK06 process and native receipt rejection controls
        if: ${{ inputs.acceptance_lane == 'hanlin-native' }}
        run: |
          python3 -B Tools/PinkhaSimulatorGate/test_hanlin_ui_runtime.py -v > build/ui27-evidence/hanlin-runtime-controller-controls.log 2>&1
          python3 -B Tools/PinkhaSimulatorGate/test_hanlin_acceptance_evidence.py -v >> build/ui27-evidence/hanlin-runtime-controller-controls.log 2>&1
      - name: Verify actual Xcode27 and create disposable OS27 iPhone and iPad
        run: python3 Tools/PinkhaSimulatorGate/preflight.py --evidence build/ui27-evidence/preflight
      - name: Install exact already verified universal r14 runtime
        env:
          GH_TOKEN: ${{ github.token }}
          HEART_SOURCE_RUN_ID: ${{ inputs.heart_source_run_id }}
        run: |
          [[ "$HEART_SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Supply source_run_id from the heart-runtime route." >&2; exit 1; }
          gh run download "$HEART_SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Pinkha-Universal-Verified-Heart-r14 --dir build/verified-heart
          python3 Tools/PinkhaNativeDerived/install_verified_heart.py \
            --archive build/verified-heart/Pinkha-Universal-Verified-Heart-r14.tar.gz \
            --inventory docs/pinkha/torah-integration/evidence/native-derived/8494cfb347/approval/revision-14/native-heart-integration.json \
            --patch docs/pinkha/torah-integration/evidence/native-derived/8494cfb347/approval/revision-14/native-heart-integration.patch \
            --app-source "$GITHUB_WORKSPACE" --source-run-id "$HEART_SOURCE_RUN_ID" \
            --expected-app-branch "$GITHUB_REF_NAME" --evidence build/ui27-evidence/heart
      - name: Restore compatible ARM64 Xcode27 compiled dependencies
        id: ui27-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ui27-derived
          key: pinkha-ui27-arm64-xcode27.0-${{ (inputs.acceptance_lane == 'hanlin-native' || inputs.acceptance_lane == 'hanlin-selection') && 'Debug-Anytype' || 'Release-Anytype' }}-${{ hashFiles('Modules/PinkhaKit/Package.swift', 'Anytype.xcodeproj/project.pbxproj', 'Anytype.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Tools/Hanlin/source.json') }}-${{ github.sha }}
          restore-keys: |
            pinkha-ui27-arm64-xcode27.0-${{ (inputs.acceptance_lane == 'hanlin-native' || inputs.acceptance_lane == 'hanlin-selection') && 'Debug-Anytype' || 'Release-Anytype' }}-${{ hashFiles('Modules/PinkhaKit/Package.swift', 'Anytype.xcodeproj/project.pbxproj', 'Anytype.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Tools/Hanlin/source.json') }}-
      - name: Build once and execute the declared native and UI selection
        if: ${{ inputs.acceptance_lane == '' }}
        id: actual-execution
        timeout-minutes: 105
        run: |
          python3 Tools/PinkhaSimulatorGate/run_ui27.py --app "$GITHUB_WORKSPACE" \
            --evidence build/ui27-evidence --derived build/ui27-derived --ui-scope "$UI27_SCOPE"
      - name: Execute the selected existing Wave-15 lane or reviewed batch preset
        if: ${{ inputs.acceptance_lane != '' }}
        id: wave15-execution
        timeout-minutes: 120
        run: |
          python3 Tools/PinkhaSimulatorGate/run_wave15_acceptance.py --app "$GITHUB_WORKSPACE"             --evidence build/ui27-evidence --derived build/ui27-derived             --lane "$UI27_ACCEPTANCE_LANE" --device "$UI27_DEVICE_FAMILY" --language "$UI27_LANGUAGE"
      - name: Package actual logs screenshots xcresult even on failure
        if: always()
        run: python3 Tools/PinkhaNativeDerived/package_evidence.py build/ui27-evidence
      - name: Retain real UI evidence remotely
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-UI27-${{ inputs.acceptance_lane || inputs.ui_scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ui27-evidence/Pinkha-Native-Derived-Evidence.zip
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compatible compilation cache after success or failed tests
        if: ${{ always() && (steps.actual-execution.outcome != 'skipped' || steps.wave15-execution.outcome != 'skipped') && steps.ui27-cache.outputs.cache-hit != 'true' && hashFiles('build/ui27-derived/Build/PinkhaSourceInputs.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: build/ui27-derived
          key: ${{ steps.ui27-cache.outputs.cache-primary-key }}
