name: Pinkha T2 generated native RPC boundary

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  generated-native-rpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_APP_SHA: ${{ inputs.source_sha || github.sha }}
      T2_GO_IMAGE: golang:1.26.5-alpine@sha256:111d79159b2326f7e80c4a4706e1ba166acb0e2611df853955f3621828cd49e8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact isolated RPC source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout pinned Heart for isolated generation and native tests
        uses: actions/checkout@v4
        with:
          repository: anyproto/anytype-heart
          ref: d98420b1113536afd08cde6de9a5816f6d27ffff
          path: heart
          persist-credentials: false
      - name: Install pinned Go for the pure Go protobuf generator
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Check RPC controller and generate actual pinned bindings
        run: |
          mkdir -p evidence/toolchain
          cd control/Tools/TorahNativeOperations
          python3 -B -m unittest -v test_native_rpc > "$GITHUB_WORKSPACE/evidence/controller-controls.log" 2>&1
          python3 -B run_native_rpc.py generate \
            --control "$GITHUB_WORKSPACE/control" --heart-source "$GITHUB_WORKSPACE/heart" \
            --work "$GITHUB_WORKSPACE/work" --evidence "$GITHUB_WORKSPACE/evidence" \
            --expected-app-sha "$EXPECTED_APP_SHA"
      - name: Restore compiled musl dependencies only
        uses: actions/cache@v4
        with:
          path: .t2-cache
          key: t2-rpc-alpine-111d7915-go1.26.5-${{ hashFiles('heart/go.sum', 'heart/tantivity_sha256.txt') }}
          restore-keys: |
            t2-account-alpine-111d7915-go1.26.5-
            t2-registry-alpine-111d7915-go1.26.5-
      - name: Compile generated interfaces and test actual protobuf byte boundary
        run: |
          mkdir -p .t2-cache
          docker pull --platform linux/amd64 "$T2_GO_IMAGE"
          docker image inspect "$T2_GO_IMAGE" > evidence/toolchain/image.json
          docker run --rm --platform linux/amd64 --cpus=2 --memory=6g --pids-limit=512 \
            --workdir /workspace \
            --mount "type=bind,src=$GITHUB_WORKSPACE/control,dst=/workspace/control,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/heart,dst=/workspace/heart" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/work,dst=/workspace/work" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/evidence,dst=/workspace/evidence" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.t2-cache,dst=/cache" \
            -e EXPECTED_APP_SHA -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_WORKFLOW_REF \
            -e CC=gcc -e CXX=g++ -e GOTOOLCHAIN=local \
            -e GOMODCACHE=/cache/go-mod -e GOCACHE=/cache/go-build \
            -e GIT_OPTIONAL_LOCKS=0 -e PYTHONDONTWRITEBYTECODE=1 \
            "$T2_GO_IMAGE" sh control/Tools/TorahNativeOperations/run_native_rpc_container.sh
      - name: Preserve honest bootstrap status
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path('evidence')
          directory.mkdir(parents=True, exist_ok=True)
          path = directory / 'receipt.json'
          if not path.exists():
              path.write_text(json.dumps({
                  'status': 'NOT_RUN_NATIVE_RPC_BOOTSTRAP_FAILED',
                  'run_id': os.environ.get('GITHUB_RUN_ID'),
                  'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                  'app_sha': os.environ.get('EXPECTED_APP_SHA'),
                  'account_wire_acceptance': 'NOT_RUN',
                  'app_capability': 'OFF',
                  'two_app_clients': 'NOT_RUN',
                  'ios_acceptance': 'NOT_RUN'
              }, indent=2) + '\n')
          PY
      - name: Preserve source-bound logs and receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-T2-Native-RPC-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
