name: Source-bound Apple host component tests

on:
  workflow_call:
    inputs:
      runtime_profile:
        description: Explicit Heart runtime identity; no automatic fallback between variants
        type: string
        default: r14
      heart_source_run_id:
        description: Successful run containing the explicitly selected verified Heart runtime
        required: true
        type: string
      expected_app_branch:
        description: Reviewed isolated integration branch; producer branches are not accepted
        required: true
        type: string
      profile:
        description: Explicit reviewed profile sdk06/editor/shared-editor/wave15-core/wave15-components; no arbitrary test selection
        required: false
        type: string
        default: sdk06

permissions:
  contents: read
  actions: read

jobs:
  sdk06-host-tests:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      HEART_SOURCE_RUN_ID: ${{ inputs.heart_source_run_id }}
      HEART_RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      EXPECTED_APP_BRANCH: ${{ inputs.expected_app_branch }}
      HOST_PROFILE: ${{ inputs.profile }}
      HOST_EVIDENCE: build/${{ inputs.profile == 'shared-editor' && 'shared-editor' || inputs.profile == 'wave15-components' && 'wave15-components' || inputs.profile == 'editor' && 'editor-host' || inputs.profile == 'wave15-core' && 'wave15-core' || 'sdk06' }}-evidence
      HOST_DERIVED: build/${{ inputs.profile == 'shared-editor' && 'shared-editor' || inputs.profile == 'wave15-components' && 'wave15-components' || inputs.profile == 'editor' && 'editor-host' || inputs.profile == 'wave15-core' && 'wave15-core' || 'sdk06' }}-derived-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout the immutable caller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select existing native ARM64 Python contract
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Verify exact caller identity before preparing dependencies
        shell: bash
        run: |
          set -euo pipefail
          case "$HOST_PROFILE" in sdk06|editor|shared-editor|wave15-core|wave15-components) ;; *) echo 'Unsupported host test profile' >&2; exit 1 ;; esac
          case "$EXPECTED_APP_BRANCH" in
            codex/chatgpt-wave15-integration-20261118|codex/chatgpt-wave15-hanlin-consumer-20261119|codex/chatgpt-wave15-ui-resume-20261119|codex/any-engine-port-20261119|codex/chatgpt-wave15-shared-20261121) ;;
            *) echo 'Unreviewed host consumer branch' >&2; exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_APP_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # This disposable CI checkout keeps its local branch at the dispatched commit.
          # Advancing the remote integration branch while queued cannot change this source.
          git switch --force-create "$EXPECTED_APP_BRANCH" "$GITHUB_SHA"
          test "$(git branch --show-current)" = "$EXPECTED_APP_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$HEART_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p "$HOST_EVIDENCE"
      - name: Read immutable Hanlin pin from the checked-out host
        id: hanlin-pin
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(".")
          lock = root / "HanlinSDK.lock.json"
          record = json.loads((lock if lock.exists() else root / "Tools/Hanlin/source.json").read_text())
          revision = record["revision"]
          if not re.fullmatch(r"[a-f0-9]{40}", revision):
              raise SystemExit("An immutable canonical Hanlin revision is required")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("revision=" + revision + "\n")
          PY
      - name: Checkout immutable public canonical Hanlin source
        uses: actions/checkout@v4
        with:
          repository: davidpovarsky/hanlin-ai
          ref: ${{ steps.hanlin-pin.outputs.revision }}
          path: .ci/hanlin-source
          persist-credentials: false
      - name: Materialize and verify the exact SDK before any SPM resolution
        run: |
          python3 Tools/Hanlin/prepare_sdk.py --source .ci/hanlin-source
          python3 Tools/Hanlin/prepare_sdk.py --check
          if [ "$HOST_PROFILE" = shared-editor ]; then
            python3 Tools/Hanlin/test_shared_editor_profile.py -v
          else
            python3 -m unittest discover -s Tools/Hanlin -p 'test_run_host*.py' -v
          fi
      - name: Verify actual Xcode27 and create disposable OS27 devices
        run: python3 Tools/PinkhaSimulatorGate/preflight.py --evidence "$HOST_EVIDENCE/preflight"
      - name: Install the explicitly selected original verified runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B Tools/PinkhaNativeDerived/download_heart_runtime.py \
            --runtime-profile "$HEART_RUNTIME_PROFILE" --source-run-id "$HEART_SOURCE_RUN_ID" \
            --app-source "$GITHUB_WORKSPACE" --expected-app-branch "$EXPECTED_APP_BRANCH" \
            --work "build/host-heart-${{ github.run_id }}-${{ github.run_attempt }}" \
            --evidence "$HOST_EVIDENCE/heart"
      - name: Build Debug-Anytype and execute the exact reviewed component profile
        timeout-minutes: 100
        run: |
          python3 Tools/Hanlin/run_host_tests.py --app "$GITHUB_WORKSPACE" \
            --evidence "$HOST_EVIDENCE" --derived "$HOST_DERIVED" \
            --expected-app-branch "$EXPECTED_APP_BRANCH" --heart-source-run-id "$HEART_SOURCE_RUN_ID" \
            --profile "$HOST_PROFILE" --runtime-profile "$HEART_RUNTIME_PROFILE"
      - name: Package actual logs and xcresult even on failure
        if: always()
        run: |
          mkdir -p "$HOST_EVIDENCE"
          python3 Tools/PinkhaNativeDerived/package_evidence.py "$HOST_EVIDENCE"
      - name: Retain source-bound profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.profile == 'shared-editor' && 'shared-editor' || inputs.profile == 'wave15-components' && 'Pinkha-Wave15-Components' || inputs.profile == 'editor' && 'Pinkha-Editor-Host' || inputs.profile == 'wave15-core' && 'Pinkha-Wave15-Core' || 'Pinkha-SDK06' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HOST_EVIDENCE }}/Pinkha-Native-Derived-Evidence.zip
          if-no-files-found: error
          retention-days: 14
