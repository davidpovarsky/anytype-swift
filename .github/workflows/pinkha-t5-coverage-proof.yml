name: Pinkha bounded T5 native source proof

on:
  workflow_call:
    inputs:
      component:
        type: string
        default: native-index

permissions:
  contents: read

jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: musl-gcc
      GOTOOLCHAIN: local
      GOFLAGS: -ldflags=-extldflags=-static
    steps:
      - name: Checkout integration proof control
        uses: actions/checkout@v4
        with:
          path: control
      - name: Checkout exact reviewed T5 fixtures
        uses: actions/checkout@v4
        with:
          ref: 947fbde24d5657d0e1229f45bb3993648884a8a1
          path: source
      - name: Checkout exact native Heart source
        uses: actions/checkout@v4
        with:
          repository: anyproto/anytype-heart
          ref: d98420b1113536afd08cde6de9a5816f6d27ffff
          path: heart
      - name: Install the Linux musl C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          mkdir -p proof/toolchain
          musl-gcc -v > proof/toolchain/compiler.log 2>&1
          dpkg-query -W musl musl-dev musl-tools | tee proof/toolchain/packages.txt
          cat > "$RUNNER_TEMP/t5-qsort-probe.c" <<'C'
          #define _GNU_SOURCE
          #include <stdlib.h>
          static int compare(const void *a, const void *b, void *context) {
              (void)context;
              return (*(const int *)a > *(const int *)b) - (*(const int *)a < *(const int *)b);
          }
          int main(void) {
              int values[] = {2, 1};
              qsort_r(values, 2, sizeof(values[0]), compare, NULL);
              return values[0] != 1 || values[1] != 2;
          }
          C
          musl-gcc -static -Werror "$RUNNER_TEMP/t5-qsort-probe.c" -o "$RUNNER_TEMP/t5-qsort-probe" > proof/toolchain/qsort-link.log 2>&1
          "$RUNNER_TEMP/t5-qsort-probe"
      - name: Install pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Restore compiled dependencies only
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: t5-ubuntu24-musl-go1.26.5-${{ hashFiles('heart/tantivity_sha256.txt', 'heart/go.sum', 'source/**/go.sum') }}-947fbde2-${{ inputs.component }}
          restore-keys: |
            t5-ubuntu24-musl-go1.26.5-${{ hashFiles('heart/tantivity_sha256.txt', 'heart/go.sum', 'source/**/go.sum') }}-
      - name: Execute one real native component with fresh evidence
        env:
          T5_COMPONENT: ${{ inputs.component }}
        run: |
          python3 control/Tools/PinkhaNativeDerived/test_run_t5_coverage_ci.py
          python3 control/Tools/PinkhaNativeDerived/run_t5_coverage_ci.py \
            --source source --heart heart --component "$T5_COMPONENT" \
            --evidence "proof/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$T5_COMPONENT"
      - name: Upload attempt evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-T5-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof/
          if-no-files-found: warn
          retention-days: 14
