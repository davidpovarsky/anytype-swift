name: Pinkha T2 native account and private history lifecycle

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native-account-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      T2_GO_IMAGE: golang:1.26.5-alpine@sha256:111d79159b2326f7e80c4a4706e1ba166acb0e2611df853955f3621828cd49e8
      EXPECTED_APP_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - name: Checkout exact T2 control and registry source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout immutable approved r14 source
        uses: actions/checkout@v4
        with:
          ref: 947fbde24d5657d0e1229f45bb3993648884a8a1
          path: approved-source
          persist-credentials: false
      - name: Checkout upstream Heart for legacy runtime
        uses: actions/checkout@v4
        with:
          repository: anyproto/anytype-heart
          ref: d98420b1113536afd08cde6de9a5816f6d27ffff
          path: heart-legacy
          persist-credentials: false
      - name: Checkout upstream Heart for registered T2 runtime
        uses: actions/checkout@v4
        with:
          repository: anyproto/anytype-heart
          ref: d98420b1113536afd08cde6de9a5816f6d27ffff
          path: heart-new
          persist-credentials: false
      - name: Restore compiled musl dependencies only
        uses: actions/cache@v4
        with:
          path: .t2-cache
          key: t2-account-alpine-111d7915-go1.26.5-${{ hashFiles('heart-legacy/go.sum', 'heart-legacy/tantivity_sha256.txt') }}
          restore-keys: |
            t2-account-alpine-111d7915-go1.26.5-
            t2-registry-alpine-111d7915-go1.26.5-
            t5-alpine-111d7915-go1.26.5-
      - name: Build exact runtimes and exercise disposable native account lifecycle
        run: |
          mkdir -p evidence/toolchain work .t2-cache
          docker pull --platform linux/amd64 "$T2_GO_IMAGE"
          docker image inspect "$T2_GO_IMAGE" > evidence/toolchain/image.json
          docker run --rm --platform linux/amd64 --cpus=2 --memory=6g --pids-limit=512 \
            --workdir /workspace \
            --mount "type=bind,src=$GITHUB_WORKSPACE/control,dst=/workspace/control,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/approved-source,dst=/workspace/approved-source,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/heart-legacy,dst=/workspace/heart-legacy" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/heart-new,dst=/workspace/heart-new" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/evidence,dst=/workspace/evidence" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/work,dst=/workspace/work" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.t2-cache,dst=/cache" \
            -e EXPECTED_APP_SHA -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_WORKFLOW_REF \
            -e CC=gcc -e CXX=g++ -e GOTOOLCHAIN=local \
            -e GOMODCACHE=/cache/go-mod -e GOCACHE=/cache/go-build \
            -e GIT_OPTIONAL_LOCKS=0 -e PYTHONDONTWRITEBYTECODE=1 \
            "$T2_GO_IMAGE" sh control/Tools/TorahNativeOperations/run_account_lifecycle_container.sh
      - name: Preserve an honest bootstrap result
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path('evidence')
          directory.mkdir(parents=True, exist_ok=True)
          receipt = directory / 'receipt.json'
          if not receipt.exists():
              receipt.write_text(json.dumps({
                  'status': 'NOT_RUN_BOOTSTRAP_FAILED',
                  'run_id': os.environ.get('GITHUB_RUN_ID'),
                  'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                  'app_sha_expected': os.environ.get('EXPECTED_APP_SHA'),
                  'private_account_lifecycle': 'NOT_RUN',
                  'unknown_client_preservation': 'NOT_RUN',
                  'app_capability': 'OFF',
                  'full_t2_acceptance': 'NOT_RUN',
                  'two_app_clients': 'NOT_RUN',
                  'ios_acceptance': 'NOT_RUN'
              }, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Upload allowlisted synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-T2-Account-Lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
