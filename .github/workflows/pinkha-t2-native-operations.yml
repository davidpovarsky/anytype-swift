name: Pinkha T2 native operations and two-process transport

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native-operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact app source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Checkout exact upstream Heart
        uses: actions/checkout@v4
        with:
          repository: anyproto/anytype-heart
          ref: d98420b1113536afd08cde6de9a5816f6d27ffff
          path: build/Heart-T2-Operations

      - name: Install pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: build/Heart-T2-Operations/go.sum

      - name: Run native disk and isolated two-process AnySync tests
        env:
          EXPECTED_APP_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          python3 Tools/TorahNativeOperations/run_native_operations.py \
            --heart-source build/Heart-T2-Operations \
            --evidence build/t2-native-operations-evidence \
            --expected-app-sha "$EXPECTED_APP_SHA"

      - name: Record a bootstrap failure if tests never started
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path('build/t2-native-operations-evidence')
          directory.mkdir(parents=True, exist_ok=True)
          receipt = directory / 'receipt.json'
          if not receipt.exists():
              receipt.write_text(json.dumps({
                  'status': 'NOT_RUN_BOOTSTRAP_FAILED',
                  'run_id': os.environ.get('GITHUB_RUN_ID'),
                  'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                  'native_component_tests': 'NOT_RUN',
                  'two_client_transport_acceptance': 'NOT_RUN',
                  'ios_acceptance': 'NOT_RUN'
              }, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload source-bound native and transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-T2-Native-Operations-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/t2-native-operations-evidence
          if-no-files-found: error
          retention-days: 14

  native-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      T2_GO_IMAGE: golang:1.26.5-alpine@sha256:111d79159b2326f7e80c4a4706e1ba166acb0e2611df853955f3621828cd49e8
      EXPECTED_APP_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - name: Checkout exact registry proof source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          path: control
      - name: Checkout exact upstream Heart for registry adapter
        uses: actions/checkout@v4
        with:
          repository: anyproto/anytype-heart
          ref: d98420b1113536afd08cde6de9a5816f6d27ffff
          path: heart
      - name: Restore compiled musl dependencies only
        uses: actions/cache@v4
        with:
          path: .t2-cache
          key: t2-registry-alpine-111d7915-go1.26.5-${{ hashFiles('heart/go.sum', 'heart/tantivity_sha256.txt') }}
          restore-keys: |
            t2-registry-alpine-111d7915-go1.26.5-
            t5-alpine-111d7915-go1.26.5-
      - name: Compile and verify native registry storage adapter
        run: |
          mkdir -p evidence/toolchain work .t2-cache
          docker pull --platform linux/amd64 "$T2_GO_IMAGE"
          docker image inspect "$T2_GO_IMAGE" > evidence/toolchain/image.json
          docker run --rm --platform linux/amd64 --cpus=2 --memory=6g --pids-limit=512 \
            --workdir /workspace \
            --mount "type=bind,src=$GITHUB_WORKSPACE/control,dst=/workspace/control,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/heart,dst=/workspace/heart" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/evidence,dst=/workspace/evidence" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/work,dst=/workspace/work" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.t2-cache,dst=/cache" \
            -e EXPECTED_APP_SHA -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_WORKFLOW_REF -e GITHUB_REPOSITORY \
            -e CC=gcc -e CXX=g++ -e GOTOOLCHAIN=local \
            -e GOMODCACHE=/cache/go-mod -e GOCACHE=/cache/go-build \
            -e GIT_OPTIONAL_LOCKS=0 -e PYTHONDONTWRITEBYTECODE=1 \
            "$T2_GO_IMAGE" sh control/Tools/TorahNativeOperations/run_native_registration_container.sh
      - name: Preserve an honest registry bootstrap status
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path('evidence')
          directory.mkdir(parents=True, exist_ok=True)
          receipt = directory / 'receipt.json'
          if not receipt.exists():
              receipt.write_text(json.dumps({
                  'status': 'NOT_RUN_BOOTSTRAP_FAILED',
                  'run_id': os.environ.get('GITHUB_RUN_ID'),
                  'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                  'app_sha_expected': os.environ.get('EXPECTED_APP_SHA'),
                  'private_registry_adapter': 'NOT_RUN',
                  'full_t2_acceptance': 'NOT_RUN',
                  'ios_acceptance': 'NOT_RUN',
                  'native_host_rpc_acl_hidden_lifecycle': 'NOT_BOUND_TO_APP'
              }, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Upload registry adapter proof and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-T2-Registry-Evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
