name: Pinkha T2 native operations and two-process transport

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native-operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact app source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Checkout exact upstream Heart
        uses: actions/checkout@v4
        with:
          repository: anyproto/anytype-heart
          ref: d98420b1113536afd08cde6de9a5816f6d27ffff
          path: build/Heart-T2-Operations

      - name: Install pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: build/Heart-T2-Operations/go.sum

      - name: Run native disk and isolated two-process AnySync tests
        env:
          EXPECTED_APP_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          python3 Tools/TorahNativeOperations/run_native_operations.py \
            --heart-source build/Heart-T2-Operations \
            --evidence build/t2-native-operations-evidence \
            --expected-app-sha "$EXPECTED_APP_SHA"

      - name: Record a bootstrap failure if tests never started
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path('build/t2-native-operations-evidence')
          directory.mkdir(parents=True, exist_ok=True)
          receipt = directory / 'receipt.json'
          if not receipt.exists():
              receipt.write_text(json.dumps({
                  'status': 'NOT_RUN_BOOTSTRAP_FAILED',
                  'run_id': os.environ.get('GITHUB_RUN_ID'),
                  'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                  'native_component_tests': 'NOT_RUN',
                  'two_client_transport_acceptance': 'NOT_RUN',
                  'ios_acceptance': 'NOT_RUN'
              }, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload source-bound native and transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-T2-Native-Operations-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/t2-native-operations-evidence
          if-no-files-found: error
          retention-days: 14
