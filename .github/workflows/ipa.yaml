name: Build IPA

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "App build type"
        required: false
        default: release
        type: choice
        options:
          - release
          - dev
  repository_dispatch:
    types:
      - trigger-build

jobs:
  main:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.1'

      - name: Run PinkhaKit Unit Tests
        run: swift test --package-path Modules/PinkhaKit

      - name: Cache Middleware
        uses: actions/cache@v4
        with:
          path: .libcache
          key: middleware-libcache-${{ hashFiles('Libraryfile') }}

      - name: Download Middleware
        run: make setup-middle-ci
        env:
          CI: 'true'
          MIDDLEWARE_TOKEN: ${{ secrets.MIDDLEWARE_TOKEN }}

      - name: Cache Swift Package Dependencies
        uses: actions/cache@v4
        with:
          path: ./build/DerivedData/SourcePackages
          key: xcode-spm-packages-${{ hashFiles('Anytype.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            xcode-spm-packages-

      - name: Build Anytype for iOS Device (Unsigned)
        run: |
          xcodebuild build \
            -project Anytype.xcodeproj \
            -scheme Anytype \
            -configuration Release-Anytype \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned Device IPA
        run: |
          APP_PATH="./build/DerivedData/Build/Products/Release-Anytype-iphoneos/Anytype.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "Error: $APP_PATH not found! Checking available products:"
            find ./build/DerivedData/Build/Products -maxdepth 2
            exit 1
          fi

          mkdir -p ./build/ipa/Payload
          cp -R "$APP_PATH" ./build/ipa/Payload/
          cd ./build/ipa
          zip -r -y Anytype-Hebrew-Unsigned.ipa Payload
          cd ../..
          ls -lh ./build/ipa/Anytype-Hebrew-Unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anytype-Hebrew-Unsigned-Device-IPA
          path: ./build/ipa/Anytype-Hebrew-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ./build/DerivedData/Logs/
          if-no-files-found: ignore
