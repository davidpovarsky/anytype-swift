name: Pinkha IPA-only

on:
  workflow_call:
    inputs:
      require_full_acceptance:
        description: Require Full Acceptance success on the same SHA
        type: boolean
        default: true

concurrency:
  group: pinkha-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  unsigned-ipa:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Full Acceptance for this SHA
        if: inputs.require_full_acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$(gh run list \
            --workflow torah-inspector-ipados27.yml \
            --commit "$GITHUB_SHA" \
            --event workflow_dispatch \
            --limit 20 \
            --json databaseId,conclusion,displayTitle \
            --jq '[.[] | select(.displayTitle | startswith("Pinkha full-acceptance")) | select(.conclusion == "success")][0] // {}')"
          conclusion="$(jq -r '.conclusion // ""' <<< "$run_json")"
          acceptance_run_id="$(jq -r '.databaseId // ""' <<< "$run_json")"
          if [[ "$conclusion" != success || -z "$acceptance_run_id" ]]; then
            echo "Pinkha Full Acceptance is not green for $GITHUB_SHA (conclusion: ${conclusion:-missing})." >&2
            exit 1
          fi
          echo "FULL_ACCEPTANCE_RUN_ID=$acceptance_run_id" >> "$GITHUB_ENV"

      - name: Record owner override
        if: ${{ !inputs.require_full_acceptance }}
        run: echo 'FULL_ACCEPTANCE_RUN_ID=OWNER_OVERRIDE' >> "$GITHUB_ENV"

      - name: Record toolchain
        run: |
          mkdir -p build/evidence
          xcodebuild -version | tee build/evidence/xcode-version.txt
          xcodebuild -showsdks | tee build/evidence/xcode-sdks.txt
          swift --version | tee build/evidence/swift-version.txt

      - name: Verify immutable TorahInspectorKit pins
        run: |
          test "$(grep -c 'a2fa3a528ac2bccfa00ed206d7954083077fc847' Modules/PinkhaKit/Package.swift)" -eq 1
          test "$(grep -c 'a2fa3a528ac2bccfa00ed206d7954083077fc847' Anytype.xcodeproj/project.pbxproj)" -eq 1

      - name: Download middleware
        run: make setup-middle-ci
        env:
          CI: 'true'
          MIDDLEWARE_TOKEN: ${{ secrets.MIDDLEWARE_TOKEN }}

      - name: Build unsigned iPad device app
        id: device_build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Anytype.xcodeproj \
            -scheme Anytype \
            -configuration Release-Anytype \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData-Device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build/evidence/device-build.log

      - name: Package and audit unsigned IPA
        id: package_ipa
        run: |
          APP_PATH='build/DerivedData-Device/Build/Products/Release-Anytype-iphoneos/Anytype.app'
          test -d "$APP_PATH"
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          plist = Path('build/DerivedData-Device/Build/Products/Release-Anytype-iphoneos/Anytype.app/Info.plist')
          with plist.open('rb') as stream:
              info = plistlib.load(stream)
          info['CFBundleIdentifier'] = 'com.gloiiire.anytype.torahtrial'
          info['CFBundleDisplayName'] = 'Anytype Torah'
          info['PinkhaBuildCommit'] = os.environ['GITHUB_SHA']
          info['PinkhaBuildConfiguration'] = 'Release-Anytype'
          info['PinkhaAcceptanceRun'] = os.environ['FULL_ACCEPTANCE_RUN_ID']
          with plist.open('wb') as stream:
              plistlib.dump(info, stream, fmt=plistlib.FMT_BINARY)
          PY
          if [[ -d "$APP_PATH/PlugIns" ]]; then
            rm -rf "$APP_PATH/PlugIns"
          fi
          plutil -p "$APP_PATH/Info.plist" | tee build/evidence/packaged-info-plist.txt
          cp Anytype/Anytype.entitlements build/evidence/original-release-entitlements-not-applied.plist
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          app = Path('build/DerivedData-Device/Build/Products/Release-Anytype-iphoneos/Anytype.app')
          with (app / 'Info.plist').open('rb') as stream:
              info = plistlib.load(stream)
          assert info['CFBundleIdentifier'] == 'com.gloiiire.anytype.torahtrial'
          assert info['CFBundleDisplayName'] == 'Anytype Torah'
          assert info['PinkhaBuildCommit'] == os.environ['GITHUB_SHA']
          assert info['PinkhaBuildConfiguration'] == 'Release-Anytype'
          assert info['PinkhaAcceptanceRun'] == os.environ['FULL_ACCEPTANCE_RUN_ID']
          assert 2 in info['UIDeviceFamily'], info['UIDeviceFamily']
          assert info.get('MinimumOSVersion'), 'MinimumOSVersion is missing'
          assert not (app / 'PlugIns').exists(), 'Embedded extensions were not removed'
          assert not (app / '_CodeSignature').exists(), 'Code signature directory is present'
          Path('build/evidence/package-audit.txt').write_text(
              'Bundle ID: ' + info['CFBundleIdentifier'] + '\n'
              'Display name: ' + info['CFBundleDisplayName'] + '\n'
              'UIDeviceFamily: ' + repr(info['UIDeviceFamily']) + '\n'
              'MinimumOSVersion: ' + info['MinimumOSVersion'] + '\n'
              'PinkhaBuildCommit: ' + info['PinkhaBuildCommit'] + '\n'
              'PinkhaBuildConfiguration: ' + info['PinkhaBuildConfiguration'] + '\n'
              'PinkhaAcceptanceRun: ' + info['PinkhaAcceptanceRun'] + '\n'
              'Embedded PlugIns: absent\n'
              'Build entitlements override: empty\n',
              encoding='utf-8'
          )
          PY
          if codesign -d --entitlements :- "$APP_PATH" > build/evidence/codesign-audit.txt 2>&1; then
            echo 'Unexpected code signature on unsigned app update' >&2
            exit 1
          else
            printf '\nExpected result: app is unsigned and has no embedded signing entitlements.\n' \
              >> build/evidence/codesign-audit.txt
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/AnytypeTorah.app
          ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload build/ipa/Anytype-Torah-iPadOS27-Unsigned.ipa
          shasum -a 256 build/ipa/Anytype-Torah-iPadOS27-Unsigned.ipa | tee build/evidence/ipa-sha256.txt
          printf 'Anytype commit: %s\nTorahInspectorKit commit: %s\nBundle ID: %s\nFull Acceptance run: %s\n' \
            "$GITHUB_SHA" \
            'a2fa3a528ac2bccfa00ed206d7954083077fc847' \
            'com.gloiiire.anytype.torahtrial' \
            "$FULL_ACCEPTANCE_RUN_ID" \
            > build/evidence/manifest.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Anytype-Torah-iPadOS27-Unsigned-IPA
          path: build/ipa/Anytype-Torah-iPadOS27-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-IPA-Evidence
          path: build/evidence
          if-no-files-found: warn
          retention-days: 14
