name: Build Unsigned Device IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.1'

      - name: Install iOS Platform
        run: xcodebuild -downloadPlatform iOS

      - name: Download Middleware
        run: make setup-middle-ci
        env:
          CI: 'true'

      - name: Build Anytype for iOS Device (Unsigned)
        run: |
          xcodebuild clean build \
            -project Anytype.xcodeproj \
            -scheme Anytype \
            -configuration Release-Anytype \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned Device IPA
        run: |
          APP_PATH="./build/DerivedData/Build/Products/Release-Anytype-iphoneos/Anytype.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "Error: $APP_PATH not found! Checking available products:"
            find ./build/DerivedData/Build/Products -maxdepth 2
            exit 1
          fi

          mkdir -p ./build/ipa/Payload
          cp -R "$APP_PATH" ./build/ipa/Payload/
          cd ./build/ipa
          zip -r -y Anytype-Hebrew-Unsigned.ipa Payload
          cd ../..
          ls -lh ./build/ipa/Anytype-Hebrew-Unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anytype-Hebrew-Unsigned-Device-IPA
          path: ./build/ipa/Anytype-Hebrew-Unsigned.ipa
          if-no-files-found: error

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ./build/DerivedData/Logs/
          if-no-files-found: ignore
