name: Pinkha T5 native property attachment correction

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-attachment:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      T5_GO_IMAGE: golang:1.26.5-alpine@sha256:111d79159b2326f7e80c4a4706e1ba166acb0e2611df853955f3621828cd49e8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact correction and evidence controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout pinned native Heart
        uses: actions/checkout@v4
        with:
          repository: anyproto/anytype-heart
          ref: d98420b1113536afd08cde6de9a5816f6d27ffff
          path: heart
          persist-credentials: false
      - name: Verify the native evidence rejection controls
        run: |
          mkdir -p evidence/toolchain
          python3 -B control/Tools/PinkhaNativeDerived/test_t5_native_attachment.py > evidence/controller-controls.log 2>&1
      - name: Restore compiled musl dependencies only
        uses: actions/cache@v4
        with:
          path: .t5-cache
          key: t5-attachment-alpine-111d7915-go1.26.5-${{ hashFiles('heart/tantivity_sha256.txt', 'heart/go.sum') }}-${{ github.sha }}
          restore-keys: |
            t5-attachment-alpine-111d7915-go1.26.5-
            t5-alpine-111d7915-go1.26.5-
            t2-rpc-lifecycle-races-alpine-111d7915-go1.26.5-
      - name: Run actual native packages and the original-source negative control
        run: |
          mkdir -p native-work .t5-cache
          docker pull --platform linux/amd64 "$T5_GO_IMAGE"
          docker image inspect "$T5_GO_IMAGE" > evidence/toolchain/image.json
          docker run --rm --platform linux/amd64 --cpus=2 --memory=6g --pids-limit=512 \
            --workdir /workspace \
            --mount "type=bind,src=$GITHUB_WORKSPACE/control,dst=/workspace/control,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/heart,dst=/workspace/heart" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/native-work,dst=/workspace/work" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/evidence,dst=/workspace/evidence" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.t5-cache,dst=/cache" \
            -e T5_GO_IMAGE -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA -e GITHUB_WORKFLOW_REF \
            -e CC=gcc -e CXX=g++ -e GOTOOLCHAIN=local \
            -e GOMODCACHE=/cache/go-mod -e GOCACHE=/cache/go-build \
            -e GIT_OPTIONAL_LOCKS=0 -e PYTHONDONTWRITEBYTECODE=1 \
            "$T5_GO_IMAGE" sh control/Tools/PinkhaNativeDerived/run_t5_native_attachment_container.sh
      - name: Preserve honest bootstrap status
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          destination = Path('evidence/attachment-receipt.json')
          if not destination.exists():
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(json.dumps({
                  'status': 'NOT_RUN_NATIVE_ATTACHMENT_BOOTSTRAP_FAILED',
                  'run_id': os.environ.get('GITHUB_RUN_ID'),
                  'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                  'app_sha': os.environ.get('GITHUB_SHA'),
                  'native_packages': 'NOT_RUN', 'original_source_negative_control': 'NOT_RUN',
                  'apple_runtime': 'NOT_RUN', 'unmodified_old_client_compatibility': 'NOT_PROVEN',
                  'full_t5_acceptance': 'NOT_PROVEN'
              }, indent=2) + '\n')
          PY
      - name: Retain source-bound native evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-T5-Native-Attachment-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
