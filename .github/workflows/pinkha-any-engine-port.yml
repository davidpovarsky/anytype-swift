      - name: Preserve original native products before admission
        id: native-products-originals
        if: ${{ !cancelled() && steps.native-ui-build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess, tarfile
          from pathlib import Path
          products = Path("build/any-native-app-derived/Build/Products").resolve()
          output = Path("build/any-patched-evidence/native-products-originals")
          output.mkdir(parents=True, exist_ok=False)
          manifests = sorted(products.glob("PinkhaAnyNativeApp_*.xctestrun"))
          if not manifests:
              raise SystemExit("Built native xctestrun is missing")
          names = ["Debug-iphonesimulator/PinkhaAnyNative.app",
                   "Debug-iphonesimulator/PinkhaAnyNativeUITests-Runner.app"]
          if not all((products / name).is_dir() and not (products / name).is_symlink() for name in names):
              raise SystemExit("Built native app or UI runner is missing")
          originals = []
          for path in manifests:
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("Original xctestrun must be a regular file")
              raw = path.read_bytes()
              shutil.copyfile(path, output / path.name)
              originals.append({"path": path.name, "sha256": hashlib.sha256(raw).hexdigest(), "bytes": len(raw)})
              names.append(path.name)
          archive = output / "native-ui-products.tar.gz"
          # Python tarfile records symlinks, never follows them, and does not emit AppleDouble metadata.
          with tarfile.open(archive, "x:gz", dereference=False) as stream:
              for name in names:
                  stream.add(products / name, arcname=name)
          digest = hashlib.sha256()
          with archive.open("rb") as stream:
              while chunk := stream.read(1024 * 1024):
                  digest.update(chunk)
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if commit != os.environ["GITHUB_SHA"]:
              raise SystemExit("Build products must retain their original source commit")
          record = {"schemaVersion": 1, "status": "PRESERVED_BUILD_PRODUCTS_NOT_ADMITTED",
                    "commit": commit, "githubRunID": os.environ["GITHUB_RUN_ID"],
                    "githubRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "archive": archive.name, "archiveSHA256": digest.hexdigest(),
                    "archiveBytes": archive.stat().st_size, "archiveRoots": names, "xctestrun": originals,
                    "claimBoundary": "Original compiled products only; no admission or test execution claim."}
          (output / "manifest.json").write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps({key: record[key] for key in ("status", "archiveSHA256", "archiveBytes", "xctestrun")}))
          PY
