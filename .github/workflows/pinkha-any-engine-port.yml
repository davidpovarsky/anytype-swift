name: Any engine port validation

on:
  push:
    branches: [codex/any-engine-port-20261119]
    paths:
      - 'Modules/PinkhaAnyEngine/**'
      - 'Modules/PinkhaAnyIntegration/**'
      - 'Modules/PinkhaAnyRuntime/**'
      - 'Modules/PinkhaAnyHost/**'
      - 'Modules/PinkhaAnyHanlin/**'
      - 'Modules/PinkhaAnyNative/**'
      - 'NativeApp/**'
      - 'Modules/PinkhaAnyUI/**'
      - 'Modules/PinkhaTorahPresentation/**'
      - 'Anytype/Sources/Pinkha/**'
      - 'AnyTypeTests/Pinkha/**'
      - 'docs/any-engine-port/SOURCE_REFACTOR_MAP.json'
      - 'Modules/PinkhaKit/**'
      - 'Tools/AnyEnginePort/**'
      - 'Tools/AnyEngineValidation/**'
      - '.github/workflows/pinkha-any-engine-port.yml'
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Full, remaining acceptance, unpassed native UI, or isolated candidate operation read
        type: choice
        options: [full, remaining, remaining-native-ui, candidate-runtime-read]
        default: full
      native_artifact_run_id:
        description: Original native binary producer run for unchanged-source reuse
        type: string
        default: ''
      native_producer_commit:
        description: Exact original native producer commit
        type: string
        default: ''
      ui_artifact_run_id:
        description: Original UIKit14 execution run for verified unchanged-source reuse
        type: string
        default: ''
      ui_producer_commit:
        description: Exact original UIKit14 producer commit
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  # Every job checks out an immutable SHA and owns its simulator/data directory.
  # Let a newer source revision validate while older retained-consumer work finishes.
  group: any-engine-port-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apple-packages:
    if: ${{ inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' && inputs.validation_scope != 'candidate-runtime-read' }}
    name: Apple package contracts and preserved domain behavior
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout immutable canonical Hanlin source
        uses: actions/checkout@v4
        with:
          repository: davidpovarsky/hanlin-ai
          ref: 116cc6be0654a5d11bc56ba00e0310031107ee36
          path: .ci/hanlin-source
          persist-credentials: false
      - name: Materialize the verified shared Hanlin SDK
        run: |
          python3 Tools/Hanlin/prepare_sdk.py --source .ci/hanlin-source
          python3 Tools/Hanlin/prepare_sdk.py --check
      - name: Record exact source and Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/any-engine-port
          git rev-parse HEAD > build/any-engine-port/source-sha.txt
          swift --version | tee build/any-engine-port/swift-version.txt
          xcodebuild -version | tee build/any-engine-port/xcode-version.txt
      - name: Check the retained source and capability inventory
        run: python3 Tools/AnyEnginePort/verify_source_retention.py --base 586c98bcc17dee425664224e508fc0e8df277678 --output build/any-engine-port/source-retention.json
      - name: Test the Any transport and immutable operation contracts
        if: ${{ !cancelled() && inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Modules/PinkhaAnyEngine 2>&1 | tee build/any-engine-port/any-engine-tests.log
      - name: Test the Pinkha integration against its canonical domain models
        if: ${{ !cancelled() && inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Modules/PinkhaAnyIntegration 2>&1 | tee build/any-engine-port/any-integration-tests.log
      - name: Exercise the original provider against public Sefaria
        if: ${{ !cancelled() && inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        shell: bash
        run: |
          set -euo pipefail
          PROBE_BIN_DIRECTORY="$(swift build --package-path Modules/PinkhaAnyIntegration --show-bin-path)"
          python3 Tools/AnyEnginePort/run_live_provider_probe.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --executable "$PROBE_BIN_DIRECTORY/pinkha-any-integration-probe" \
            --output-dir build/any-engine-port/live-public-provider \
            --build-log build/any-engine-port/any-integration-tests.log \
            --timeout-seconds 720
      - name: Test native editor, creation receipts and protected metadata
        if: ${{ !cancelled() && inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Modules/PinkhaAnyHost 2>&1 | tee build/any-engine-port/any-host-tests.log
      - name: Test the shared Hanlin policy and native host binding
        if: ${{ !cancelled() && inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Modules/PinkhaAnyHanlin 2>&1 | tee build/any-engine-port/any-hanlin-tests.log
      - name: Test the preserved Torah presentation state machine
        if: ${{ !cancelled() && inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Modules/PinkhaTorahPresentation 2>&1 | tee build/any-engine-port/torah-presentation-tests.log
      - name: Compile and test the native presentation model on Apple
        if: ${{ !cancelled() && inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Modules/PinkhaAnyUI 2>&1 | tee build/any-engine-port/any-ui-tests.log
      - name: Re-run preserved Pinkha domain behavior
        if: ${{ !cancelled() && inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Modules/PinkhaKit 2>&1 | tee build/any-engine-port/pinkhakit-tests.log
      - name: Upload source-bound package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: any-engine-port-apple-packages-${{ github.sha }}
          path: build/any-engine-port/
          retention-days: 14
          if-no-files-found: error

  ios-runtime:
    if: ${{ inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' && inputs.validation_scope != 'candidate-runtime-read' }}
    name: Real embedded Any library on iOS Simulator
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create one simulator owned by this run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/any-native-evidence
          git rev-parse HEAD > build/any-native-evidence/source-sha.txt
          xcodebuild -version > build/any-native-evidence/xcode-version.txt
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          candidates = [
              (runtime, device)
              for runtime, values in devices["devices"].items()
              if ".iOS-" in runtime
              for device in values
              if device.get("isAvailable") and device.get("deviceTypeIdentifier")
              and (device["name"].startswith("iPad") or device["name"].startswith("iPhone"))
          ]
          if not candidates:
              raise SystemExit("No compatible iOS simulator template is available")
          runtime_info = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "--json"]))
          runtime_by_id = {value["identifier"]: value for value in runtime_info["runtimes"]}
          def runtime_version(identifier):
              info = runtime_by_id.get(identifier, {})
              version = info.get("version", "")
              parts = version.split(".") if isinstance(version, str) else []
              if not info.get("isAvailable") or not parts or not all(part.isdigit() for part in parts):
                  return ()
              return tuple(int(part) for part in parts)
          candidates = [item for item in candidates if runtime_version(item[0]) >= (27,)]
          if not candidates:
              raise SystemExit("No iOS 27 or newer simulator template is available")
          runtime, device = sorted(candidates,
              key=lambda item: (runtime_version(item[0]), item[1]["name"].startswith("iPad")),
              reverse=True)[0]
          udid = subprocess.check_output([
              "xcrun", "simctl", "create", "AnyPort-" + os.environ["GITHUB_RUN_ID"],
              device["deviceTypeIdentifier"], runtime
          ], text=True).strip()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("ANY_NATIVE_SIMULATOR_UDID=" + udid + "\n")
          with open("build/any-native-evidence/simulator.json", "w") as output:
              json.dump({"ownedUDID": udid, "runtime": runtime, "deviceType": device["deviceTypeIdentifier"]}, output)
          PY
      - name: Build and run the linked AnyLib lifecycle tests
        working-directory: Modules/PinkhaAnyRuntime
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme PinkhaAnyRuntime \
            -destination "platform=iOS Simulator,id=$ANY_NATIVE_SIMULATOR_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/any-native-derived" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/any-native-evidence/runtime.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 180 \
            2>&1 | tee "$GITHUB_WORKSPACE/build/any-native-evidence/runtime.log"
      - name: Extract native execution counts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d build/any-native-evidence/runtime.xcresult ]; then
            xcrun xcresulttool get test-results summary \
              --path build/any-native-evidence/runtime.xcresult --format json \
              > build/any-native-evidence/test-counts.json || true
            xcrun xcresulttool get test-results tests \
              --path build/any-native-evidence/runtime.xcresult --format json \
              > build/any-native-evidence/test-methods.json || true
          fi
          python3 Tools/AnyEnginePort/verify_native_test_execution.py \
            --profile runtime --udid "${ANY_NATIVE_SIMULATOR_UDID:-}" \
            --summary build/any-native-evidence/test-counts.json \
            --tests build/any-native-evidence/test-methods.json \
            --output build/any-native-evidence/named-execution.json
      - name: Remove only this run's simulator
        if: always()
        shell: bash
        run: |
          if [ -n "${ANY_NATIVE_SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$ANY_NATIVE_SIMULATOR_UDID" || true
            xcrun simctl delete "$ANY_NATIVE_SIMULATOR_UDID"
          fi
      - name: Upload real-library evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: any-engine-port-ios-runtime-${{ github.sha }}
          path: build/any-native-evidence/
          retention-days: 14
          if-no-files-found: error

  ios-native-runtime:
    if: ${{ inputs.validation_scope != 'candidate-runtime-read' }}
    name: Patched native Any library on iOS Simulator
    runs-on: xcode-27
    timeout-minutes: 80
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PINKHA_ANY_NATIVE_ARTIFACT: verified-v1
      ANY_BUILD_VERSION: v0.5.0-pinkha.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout immutable canonical Hanlin source
        uses: actions/checkout@v4
        with:
          repository: davidpovarsky/hanlin-ai
          ref: 116cc6be0654a5d11bc56ba00e0310031107ee36
          path: .ci/hanlin-source
          persist-credentials: false
      - name: Materialize the verified shared Hanlin SDK
        run: |
          python3 Tools/Hanlin/prepare_sdk.py --source .ci/hanlin-source
          python3 Tools/Hanlin/prepare_sdk.py --check
      - name: Checkout exact upstream Any
        if: ${{ inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        uses: actions/checkout@v4
        with:
          repository: anyproto/any
          ref: 88fae2e5ae7d0f46d6707567a3123081faa8de9a
          path: .ci/any-source
          persist-credentials: false
      - name: Checkout exact upstream SDK in the portable replace path
        if: ${{ inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        uses: actions/checkout@v4
        with:
          repository: anyproto/any-sync-sdk
          ref: 854df54cdadd76006ae823cbd1b1d923138356d0
          path: .ci/any-source/.runtime-artifacts/sdk-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        if: ${{ inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        with:
          go-version-file: .ci/any-source/go.mod
          cache-dependency-path: |
            .ci/any-source/go.sum
            .ci/any-source/.runtime-artifacts/sdk-source/go.sum
      - name: Apply and verify exact native source overlays
        if: ${{ inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        run: |
          python3 Tools/AnyEnginePort/prepare_native_runtime.py apply \
            --any-root .ci/any-source \
            --output build/any-patched-evidence/native-source.json
      - name: Test the actual iOS C lifecycle shim
        if: ${{ inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        working-directory: .ci/any-source
        run: go test -count=1 ./mobile/ios/
      - name: Build device and simulator native slices
        if: ${{ inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        working-directory: .ci/any-source
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-xcframework.sh dist 2>&1 | tee "$GITHUB_WORKSPACE/build/any-patched-evidence/native-build.log"
      - name: Bind artifact hashes to the tested sources and install
        if: ${{ inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        id: native-artifact
        run: |
          python3 Tools/AnyEnginePort/prepare_native_runtime.py record \
            --any-root .ci/any-source --output build/any-patched-artifact
          python3 Tools/AnyEnginePort/prepare_native_runtime.py install \
            --artifact build/any-patched-artifact
      - name: Verify retained source provenance before Apple acceptance
        run: python3 Tools/AnyEnginePort/verify_source_retention.py --base 586c98bcc17dee425664224e508fc0e8df277678 --output build/any-patched-evidence/source-retention.json
      - name: Reuse the original binary after exact native source verification
        id: native-reuse
        if: ${{ inputs.validation_scope == 'remaining' || inputs.validation_scope == 'remaining-native-ui' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT_RUN_ID: ${{ inputs.native_artifact_run_id }}
          NATIVE_PRODUCER_COMMIT: ${{ inputs.native_producer_commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NATIVE_ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$NATIVE_PRODUCER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh run download "$NATIVE_ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "any-pinkha-native-xcframework-$NATIVE_PRODUCER_COMMIT" --dir build/any-reused-artifact
          python3 Tools/AnyEnginePort/prepare_native_runtime.py install \
            --artifact build/any-reused-artifact --producer-commit "$NATIVE_PRODUCER_COMMIT"
          mkdir -p build/any-patched-evidence
          cp Modules/PinkhaAnyRuntime/Vendor/consumer-binding.json build/any-patched-evidence/native-reuse.json
          cp Modules/PinkhaAnyRuntime/Vendor/native-artifact.json build/any-patched-evidence/original-native-artifact.json
      - name: Create one simulator owned by this run
        id: native-simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/any-patched-evidence
          git rev-parse HEAD > build/any-patched-evidence/source-sha.txt
          xcodebuild -version > build/any-patched-evidence/xcode-version.txt
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          candidates = [
              (runtime, device)
              for runtime, values in devices["devices"].items()
              if ".iOS-" in runtime
              for device in values
              if device.get("isAvailable") and device.get("deviceTypeIdentifier")
              and (device["name"].startswith("iPad") or device["name"].startswith("iPhone"))
          ]
          if not candidates:
              raise SystemExit("No compatible iOS simulator template is available")
          runtime_info = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "--json"]))
          runtime_by_id = {value["identifier"]: value for value in runtime_info["runtimes"]}
          def runtime_version(identifier):
              info = runtime_by_id.get(identifier, {})
              version = info.get("version", "")
              parts = version.split(".") if isinstance(version, str) else []
              if not info.get("isAvailable") or not parts or not all(part.isdigit() for part in parts):
                  return ()
              return tuple(int(part) for part in parts)
          candidates = [item for item in candidates if runtime_version(item[0]) >= (27,)]
          if not candidates:
              raise SystemExit("No iOS 27 or newer simulator template is available")
          runtime, device = sorted(candidates,
              key=lambda item: (runtime_version(item[0]), item[1]["name"].startswith("iPad")),
              reverse=True)[0]
          udid = subprocess.check_output([
              "xcrun", "simctl", "create", "AnyNativePort-" + os.environ["GITHUB_RUN_ID"],
              device["deviceTypeIdentifier"], runtime
          ], text=True).strip()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("ANY_NATIVE_SIMULATOR_UDID=" + udid + "\n")
          with open("build/any-patched-evidence/simulator.json", "w") as output:
              json.dump({"ownedUDID": udid, "runtime": runtime, "deviceType": device["deviceTypeIdentifier"]}, output)
          PY
      - name: Reuse the unchanged UIKit components from their original execution
        id: ui-reuse
        if: ${{ inputs.validation_scope == 'remaining-native-ui' && steps.native-simulator.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UI_ARTIFACT_RUN_ID: ${{ inputs.ui_artifact_run_id }}
          UI_PRODUCER_COMMIT: ${{ inputs.ui_producer_commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UI_ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$UI_PRODUCER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh run download "$UI_ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "any-engine-port-ios-patched-runtime-$UI_PRODUCER_COMMIT" --dir build/any-reused-ui-evidence
          python3 Tools/AnyEnginePort/reuse_uikit_execution.py \
            --evidence build/any-reused-ui-evidence \
            --producer-commit "$UI_PRODUCER_COMMIT" --producer-run "$UI_ARTIFACT_RUN_ID" \
            --consumer-simulator build/any-patched-evidence/simulator.json \
            --consumer-xcode-version build/any-patched-evidence/xcode-version.txt \
            --output build/any-patched-evidence/ui-ios-reuse.json
      - name: Build and run the linked AnyLib lifecycle tests
        if: ${{ inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        working-directory: Modules/PinkhaAnyRuntime
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme PinkhaAnyRuntime \
            -destination "platform=iOS Simulator,id=$ANY_NATIVE_SIMULATOR_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/any-patched-derived" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/any-patched-evidence/runtime.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 180 \
            2>&1 | tee "$GITHUB_WORKSPACE/build/any-patched-evidence/runtime.log"
      - name: Publish lifecycle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: any-engine-port-lifecycle-diagnostic-${{ github.sha }}
          path: |
            build/any-patched-evidence/runtime.log
            build/any-patched-evidence/source-sha.txt
            build/any-patched-evidence/native-source.json
            build/any-patched-evidence/xcode-version.txt
            build/any-patched-evidence/simulator.json
          retention-days: 14
          if-no-files-found: warn
      - name: Test protected Hanlin recovery on iOS
        if: ${{ !cancelled() && inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        working-directory: Modules/PinkhaAnyHanlin
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -json \
            > "$GITHUB_WORKSPACE/build/any-patched-evidence/hanlin-schemes.json"
          python3 - "$GITHUB_WORKSPACE/build/any-patched-evidence/hanlin-schemes.json" <<'PY'
          import json, pathlib, sys
          source = pathlib.Path(sys.argv[1])
          data = json.loads(source.read_text())
          containers = [data, data.get("workspace", {}), data.get("project", {})]
          schemes = {scheme for item in containers if isinstance(item, dict)
                     for scheme in item.get("schemes", []) if isinstance(scheme, str)}
          expected = "PinkhaAnyHanlin-Package"
          if expected not in schemes:
              raise SystemExit("Missing documented aggregate test scheme: " + expected)
          source.with_name("hanlin-scheme-selected.json").write_text(json.dumps({
              "selected": expected, "observedSchemes": sorted(schemes),
              "scope": "generated_scheme_preflight_not_test_execution"
          }, indent=2) + "\n")
          PY
          xcodebuild test \
            -scheme PinkhaAnyHanlin-Package \
            -destination "platform=iOS Simulator,id=$ANY_NATIVE_SIMULATOR_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/any-native-app-derived" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/any-patched-evidence/hanlin-ios.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 180 \
            2>&1 | tee "$GITHUB_WORKSPACE/build/any-patched-evidence/hanlin-ios.log"
      - name: Test the UIKit editor and composition lifecycle
        id: ui-tests
        if: ${{ !cancelled() && inputs.validation_scope != 'remaining-native-ui' && steps.native-simulator.outcome == 'success' }}
        working-directory: Modules/PinkhaAnyUI
        shell: bash
        run: |
          set -euo pipefail
          selection=()
          if [ "${{ inputs.validation_scope }}" = remaining ]; then
            selection=(-only-testing:PinkhaAnyUITests/AnyNativeTextRendererTests -only-testing:PinkhaAnyUITests/AnyNativeMarkedTextTests -only-testing:PinkhaAnyUITests/AnyNativeFocusLifecycleTests)
          fi
          xcodebuild test "${selection[@]}" \
            -scheme PinkhaAnyUI \
            -destination "platform=iOS Simulator,id=$ANY_NATIVE_SIMULATOR_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/any-native-app-derived" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/any-patched-evidence/ui-ios.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 180 \
            2>&1 | tee "$GITHUB_WORKSPACE/build/any-patched-evidence/ui-ios.log"
      - name: Test the real native account, Keychain and cold reopen path
        if: ${{ !cancelled() && inputs.validation_scope != 'remaining' && inputs.validation_scope != 'remaining-native-ui' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project NativeApp/AnyNative.xcodeproj \
            -scheme PinkhaAnyNativeHostedTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$ANY_NATIVE_SIMULATOR_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/any-native-app-derived" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/any-patched-evidence/application.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$GITHUB_WORKSPACE/build/any-patched-evidence/application.log"
      - name: Publish hosted application diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: any-engine-port-application-diagnostic-${{ github.sha }}
          path: |
            build/any-patched-evidence/application.log
            build/any-patched-evidence/source-sha.txt
            build/any-patched-evidence/native-source.json
            build/any-patched-evidence/xcode-version.txt
            build/any-patched-evidence/simulator.json
          retention-days: 14
          if-no-files-found: warn
      - name: Start the owned simulator while the required native target builds
        id: native-boot
        if: ${{ !cancelled() && inputs.validation_scope == 'remaining-native-ui' && steps.ui-reuse.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/AnyEnginePort/hanlin_fixture_ci.py boot \
            --simulator-receipt build/any-patched-evidence/simulator.json \
            --safe-dir build/any-patched-evidence/hanlin-provider
      - name: Build the selected native executable and UI tests once
        id: native-ui-build
        if: ${{ !cancelled() && (steps.ui-tests.outcome == 'success' || steps.ui-reuse.outcome == 'success') && (inputs.validation_scope != 'remaining-native-ui' || steps.native-boot.outcome == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          selection=()
          if [ "${{ inputs.validation_scope }}" = remaining ] || [ "${{ inputs.validation_scope }}" = remaining-native-ui ]; then
            selection=(-only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testCreateEditHanlinConsentBackgroundAndColdReopen -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testHierarchyMoveAndPropertyVisibilityRetainNativeBodyAndType -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testSourceInspectorQuoteAndNoteSurviveColdReopen -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testExplicitHebrewDirectionAndAlignmentSurviveColdReopen -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testHierarchyDragIntoFolderPersistsAfterColdReopen -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testSourceDragIntoNativeEditorPreservesTargetAndColdReopens -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testTopicAndWordLinksDriveDerivedRelatedDocumentsAfterColdReopen -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testHanlinSelectedContextAndSeparateCreateConsentSurviveColdReopen -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testObserveCanonicalArchiveSystemPickers)
          fi
          xcodebuild build-for-testing "${selection[@]}" \
            -project NativeApp/AnyNative.xcodeproj \
            -scheme PinkhaAnyNativeApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$ANY_NATIVE_SIMULATOR_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/any-native-app-derived" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/any-patched-evidence/native-ui-build.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 360 \
            -maximum-test-execution-time-allowance 360 \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$GITHUB_WORKSPACE/build/any-patched-evidence/native-ui-build.log"
      - name: Verify the built native app ownership boundary
        id: native-app-boundary
        if: ${{ !cancelled() && steps.native-ui-build.outcome == 'success' }}
        shell: bash
        run: |
          python3 Tools/AnyEnginePort/verify_native_app_bundle.py \
            --bundle build/any-native-app-derived/Build/Products/Debug-iphonesimulator/PinkhaAnyNative.app \
            --output build/any-patched-evidence/native-app-bundle.json
      - name: Prepare owned Hanlin HTTPS provider for mounted acceptance
        id: provider-fixture
        if: ${{ !cancelled() && steps.native-ui-build.outcome == 'success' && steps.native-app-boundary.outcome == 'success' && (steps.ui-tests.outcome == 'success' || steps.ui-reuse.outcome == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/AnyEnginePort/hanlin_fixture_ci.py prepare \
            --simulator-receipt build/any-patched-evidence/simulator.json \
            --safe-dir build/any-patched-evidence/hanlin-provider
      - name: Publish a failed owned simulator or provider preflight
        if: ${{ failure() && (steps.native-boot.outcome == 'failure' || steps.provider-fixture.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: any-engine-port-provider-preflight-${{ github.sha }}
          path: build/any-patched-evidence/hanlin-provider/
          retention-days: 14
          if-no-files-found: warn
      - name: Build and launch the separate native executable
        id: native-ui-tests
        if: ${{ !cancelled() && steps.provider-fixture.outcome == 'success' && (steps.ui-tests.outcome == 'success' || steps.ui-reuse.outcome == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          selection=()
          if [ "${{ inputs.validation_scope }}" = remaining ] || [ "${{ inputs.validation_scope }}" = remaining-native-ui ]; then
            selection=(-only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testCreateEditHanlinConsentBackgroundAndColdReopen -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testHierarchyMoveAndPropertyVisibilityRetainNativeBodyAndType -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testSourceInspectorQuoteAndNoteSurviveColdReopen -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testExplicitHebrewDirectionAndAlignmentSurviveColdReopen -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testHierarchyDragIntoFolderPersistsAfterColdReopen -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testSourceDragIntoNativeEditorPreservesTargetAndColdReopens -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testTopicAndWordLinksDriveDerivedRelatedDocumentsAfterColdReopen -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testHanlinSelectedContextAndSeparateCreateConsentSurviveColdReopen -only-testing:PinkhaAnyNativeUITests/NativeLaunchTests/testObserveCanonicalArchiveSystemPickers)
          fi
          xcodebuild test-without-building "${selection[@]}" \
            -project NativeApp/AnyNative.xcodeproj \
            -scheme PinkhaAnyNativeApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$ANY_NATIVE_SIMULATOR_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/any-native-app-derived" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/any-patched-evidence/native-ui.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 360 \
            -maximum-test-execution-time-allowance 360 \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$GITHUB_WORKSPACE/build/any-patched-evidence/native-ui.log"
      - name: Verify mounted Hanlin provider transcript contract
        if: ${{ !cancelled() && steps.provider-fixture.outcome == 'success' && steps.native-ui-tests.outcome != 'skipped' }}
        shell: bash
        run: |
          python3 Tools/AnyEnginePort/hanlin_fixture_ci.py verify \
            --safe-dir build/any-patched-evidence/hanlin-provider
      - name: Extract native execution counts
        if: ${{ always() && (inputs.validation_scope != 'remaining-native-ui' || steps.native-ui-tests.outcome != 'skipped') }}
        shell: bash
        run: |
          set -euo pipefail
          gate_exit=0
          suites=(runtime hanlin-ios ui-ios application native-ui)
          if [ "${{ inputs.validation_scope }}" = remaining ]; then
            suites=(ui-ios native-ui)
          elif [ "${{ inputs.validation_scope }}" = remaining-native-ui ]; then
            suites=(native-ui)
          fi
          for suite in "${suites[@]}"; do
            profile="$suite"
            if [[ "${{ inputs.validation_scope }}" == remaining* ]]; then profile="$suite-remaining"; fi
            if [ -d "build/any-patched-evidence/$suite.xcresult" ]; then
              xcrun xcresulttool get test-results summary \
                --path "build/any-patched-evidence/$suite.xcresult" --format json \
                > "build/any-patched-evidence/$suite-test-counts.json" || true
              xcrun xcresulttool get test-results tests \
                --path "build/any-patched-evidence/$suite.xcresult" --format json \
                > "build/any-patched-evidence/$suite-test-methods.json" || true
            fi
            python3 Tools/AnyEnginePort/verify_native_test_execution.py \
              --profile "$profile" --udid "${ANY_NATIVE_SIMULATOR_UDID:-}" \
              --summary "build/any-patched-evidence/$suite-test-counts.json" \
              --tests "build/any-patched-evidence/$suite-test-methods.json" \
              --output "build/any-patched-evidence/$suite-named-execution.json" || gate_exit=1
          done
          python3 Tools/AnyEnginePort/verify_native_test_execution.py \
            --profile archive-picker-observation --udid "${ANY_NATIVE_SIMULATOR_UDID:-}" \
            --summary build/any-patched-evidence/native-ui-test-counts.json \
            --tests build/any-patched-evidence/native-ui-test-methods.json \
            --output build/any-patched-evidence/archive-picker-observation-named-execution.json || gate_exit=1
          exit "$gate_exit"
      - name: Stop only the owned Hanlin provider and remove private TLS material
        if: always()
        shell: bash
        run: |
          python3 Tools/AnyEnginePort/hanlin_fixture_ci.py cleanup \
            --safe-dir build/any-patched-evidence/hanlin-provider
      - name: Remove only this run's simulator
        if: always()
        shell: bash
        run: |
          if [ -n "${ANY_NATIVE_SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$ANY_NATIVE_SIMULATOR_UDID" || true
            xcrun simctl delete "$ANY_NATIVE_SIMULATOR_UDID"
          fi
      - name: Upload real-library evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: any-engine-port-ios-patched-runtime-${{ github.sha }}
          path: build/any-patched-evidence/
          retention-days: 14
          if-no-files-found: error

      - name: Upload exact source-bound native artifact
        if: ${{ !cancelled() && steps.native-artifact.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: any-pinkha-native-xcframework-${{ github.sha }}
          path: build/any-patched-artifact/
          retention-days: 14
          if-no-files-found: error

  retained-app-compatibility:
    name: Retained UIKit consumers after shared extraction
    needs: apple-packages
    if: ${{ always() && !cancelled() && inputs.validation_scope != 'remaining-native-ui' && inputs.validation_scope != 'candidate-runtime-read' }}
    uses: ./.github/workflows/pinkha-sdk06-tests.yml
    with:
      heart_source_run_id: '44203168617'
      expected_app_branch: ${{ github.ref_name }}
      profile: ${{ inputs.validation_scope == 'remaining' && 'shared-editor' || 'sdk06' }}

  ios-authorized-read-candidate:
    if: ${{ inputs.validation_scope == 'candidate-runtime-read' }}
    name: Candidate authorized operation read through the real iOS runtime
    runs-on: xcode-27
    timeout-minutes: 80
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PINKHA_ANY_NATIVE_ARTIFACT: verified-v1
      PINKHA_ANY_AUTHORIZED_READ_ACCEPTANCE: candidate-v10
      ANY_BUILD_VERSION: v0.5.0-pinkha.1
      ANY_AUTHORIZED_READ_MANIFEST: Tools/AnyEngineValidation/evidence/native-authorized-operation-read-v10-candidate-source.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the isolated candidate and its optional exact binary producer
        id: candidate-inputs
        env:
          NATIVE_ARTIFACT_RUN_ID: ${{ inputs.native_artifact_run_id }}
          NATIVE_PRODUCER_COMMIT: ${{ inputs.native_producer_commit }}
          UI_ARTIFACT_RUN_ID: ${{ inputs.ui_artifact_run_id }}
          UI_PRODUCER_COMMIT: ${{ inputs.ui_producer_commit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/any-authorized-read-evidence
          test -z "$UI_ARTIFACT_RUN_ID"
          test -z "$UI_PRODUCER_COMMIT"
          if [ -n "$NATIVE_ARTIFACT_RUN_ID" ] || [ -n "$NATIVE_PRODUCER_COMMIT" ]; then
            [[ "$NATIVE_ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
            [[ "$NATIVE_PRODUCER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'Tools/AnyEnginePort')
          import prepare_native_runtime as native
          from verify_authorized_operation_read_execution import validate_candidate
          validate_candidate(native.read_manifest(Path(os.environ['ANY_AUTHORIZED_READ_MANIFEST'])))
          PY
          python3 -m unittest discover -s Tools/AnyEnginePort -p test_authorized_operation_read_execution.py -v
          python3 Tools/AnyEnginePort/verify_source_retention.py --base 586c98bcc17dee425664224e508fc0e8df277678 --output build/any-authorized-read-evidence/source-retention.json
      - name: Checkout exact candidate upstream Any
        if: ${{ steps.candidate-inputs.outputs.reuse == 'false' }}
        uses: actions/checkout@v4
        with:
          repository: anyproto/any
          ref: 88fae2e5ae7d0f46d6707567a3123081faa8de9a
          path: .ci/any-source
          persist-credentials: false
      - name: Checkout the exact unchanged SDK in its portable replace path
        if: ${{ steps.candidate-inputs.outputs.reuse == 'false' }}
        uses: actions/checkout@v4
        with:
          repository: anyproto/any-sync-sdk
          ref: 854df54cdadd76006ae823cbd1b1d923138356d0
          path: .ci/any-source/.runtime-artifacts/sdk-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        if: ${{ steps.candidate-inputs.outputs.reuse == 'false' }}
        with:
          go-version-file: .ci/any-source/go.mod
          cache-dependency-path: |
            .ci/any-source/go.sum
            .ci/any-source/.runtime-artifacts/sdk-source/go.sum
      - name: Apply and verify only the reviewed candidate source manifest
        if: ${{ steps.candidate-inputs.outputs.reuse == 'false' }}
        run: |
          python3 Tools/AnyEnginePort/prepare_native_runtime.py --manifest "$ANY_AUTHORIZED_READ_MANIFEST" apply \
            --any-root .ci/any-source --output build/any-authorized-read-evidence/native-source.json
      - name: Build both required native slices for this candidate
        if: ${{ steps.candidate-inputs.outputs.reuse == 'false' }}
        working-directory: .ci/any-source
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-xcframework.sh dist 2>&1 | tee "$GITHUB_WORKSPACE/build/any-authorized-read-evidence/native-build.log"
      - name: Bind and install the exact candidate archive
        id: candidate-native-artifact
        if: ${{ steps.candidate-inputs.outputs.reuse == 'false' }}
        run: |
          python3 Tools/AnyEnginePort/prepare_native_runtime.py --manifest "$ANY_AUTHORIZED_READ_MANIFEST" record \
            --any-root .ci/any-source --output build/any-authorized-read-artifact
          python3 Tools/AnyEnginePort/prepare_native_runtime.py --manifest "$ANY_AUTHORIZED_READ_MANIFEST" install \
            --artifact build/any-authorized-read-artifact
      - name: Preserve the completed source-bound candidate before Swift acceptance
        if: ${{ !cancelled() && steps.candidate-native-artifact.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: any-pinkha-authorized-read-xcframework-${{ github.sha }}
          path: build/any-authorized-read-artifact/
          retention-days: 14
          if-no-files-found: error
      - name: Reuse only a source-identical candidate binary after an adapter correction
        if: ${{ steps.candidate-inputs.outputs.reuse == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT_RUN_ID: ${{ inputs.native_artifact_run_id }}
          NATIVE_PRODUCER_COMMIT: ${{ inputs.native_producer_commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$NATIVE_ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "any-pinkha-authorized-read-xcframework-$NATIVE_PRODUCER_COMMIT" --dir build/any-authorized-read-reused-artifact
          python3 Tools/AnyEnginePort/prepare_native_runtime.py --manifest "$ANY_AUTHORIZED_READ_MANIFEST" install \
            --artifact build/any-authorized-read-reused-artifact --producer-commit "$NATIVE_PRODUCER_COMMIT"
      - name: Preserve installed candidate identity
        run: |
          cp Modules/PinkhaAnyRuntime/Vendor/consumer-binding.json build/any-authorized-read-evidence/native-consumer-binding.json
          cp Modules/PinkhaAnyRuntime/Vendor/native-artifact.json build/any-authorized-read-evidence/original-native-artifact.json
      - name: Create one simulator owned by this run
        id: native-simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/any-authorized-read-evidence
          git rev-parse HEAD > build/any-authorized-read-evidence/source-sha.txt
          xcodebuild -version > build/any-authorized-read-evidence/xcode-version.txt
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          candidates = [
              (runtime, device)
              for runtime, values in devices["devices"].items()
              if ".iOS-" in runtime
              for device in values
              if device.get("isAvailable") and device.get("deviceTypeIdentifier")
              and (device["name"].startswith("iPad") or device["name"].startswith("iPhone"))
          ]
          if not candidates:
              raise SystemExit("No compatible iOS simulator template is available")
          runtime_info = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "--json"]))
          runtime_by_id = {value["identifier"]: value for value in runtime_info["runtimes"]}
          def runtime_version(identifier):
              info = runtime_by_id.get(identifier, {})
              version = info.get("version", "")
              parts = version.split(".") if isinstance(version, str) else []
              if not info.get("isAvailable") or not parts or not all(part.isdigit() for part in parts):
                  return ()
              return tuple(int(part) for part in parts)
          candidates = [item for item in candidates if runtime_version(item[0]) >= (27,)]
          if not candidates:
              raise SystemExit("No iOS 27 or newer simulator template is available")
          runtime, device = sorted(candidates,
              key=lambda item: (runtime_version(item[0]), item[1]["name"].startswith("iPad")),
              reverse=True)[0]
          udid = subprocess.check_output([
              "xcrun", "simctl", "create", "AnyAuthorizedRead-" + os.environ["GITHUB_RUN_ID"],
              device["deviceTypeIdentifier"], runtime
          ], text=True).strip()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("ANY_NATIVE_SIMULATOR_UDID=" + udid + "\n")
          with open("build/any-authorized-read-evidence/simulator.json", "w") as output:
              json.dump({"ownedUDID": udid, "runtime": runtime, "deviceType": device["deviceTypeIdentifier"]}, output)
          PY
      - name: Execute only the new owned-host authorized read journey
        working-directory: Modules/PinkhaAnyRuntime
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme PinkhaAnyRuntime \
            -only-testing:PinkhaAnyRuntimeTests/AnyAuthorizedOperationReadRuntimeTests/testManagedNativeAuthorizedReadPreservesBytesAcrossBlockDeletionAndColdReopen \
            -destination "platform=iOS Simulator,id=$ANY_NATIVE_SIMULATOR_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/any-authorized-read-derived" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/any-authorized-read-evidence/runtime.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 180 \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee "$GITHUB_WORKSPACE/build/any-authorized-read-evidence/runtime.log"
      - name: Qualify the exact one named iOS method and its installed native binary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d build/any-authorized-read-evidence/runtime.xcresult ]; then
            xcrun xcresulttool get test-results summary \
              --path build/any-authorized-read-evidence/runtime.xcresult --format json \
              > build/any-authorized-read-evidence/test-counts.json || true
            xcrun xcresulttool get test-results tests \
              --path build/any-authorized-read-evidence/runtime.xcresult --format json \
              > build/any-authorized-read-evidence/test-methods.json || true
          fi
          python3 Tools/AnyEnginePort/verify_authorized_operation_read_execution.py \
            --udid "${ANY_NATIVE_SIMULATOR_UDID:-}" \
            --summary build/any-authorized-read-evidence/test-counts.json \
            --tests build/any-authorized-read-evidence/test-methods.json \
            --output build/any-authorized-read-evidence/named-execution.json
      - name: Remove only this candidate run's simulator
        if: always()
        shell: bash
        run: |
          if [ -n "${ANY_NATIVE_SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$ANY_NATIVE_SIMULATOR_UDID" || true
            xcrun simctl delete "$ANY_NATIVE_SIMULATOR_UDID"
          fi
      - name: Upload original candidate iOS execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: any-engine-port-ios-authorized-read-${{ github.sha }}
          path: build/any-authorized-read-evidence/
          retention-days: 14
          if-no-files-found: error
