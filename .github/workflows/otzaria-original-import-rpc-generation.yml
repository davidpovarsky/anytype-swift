name: Original annotation Import RPC generation

on:
  push:
    branches:
      - codex/otzaria-import-rpc-generation-20261123

permissions:
  contents: read

concurrency:
  group: otzaria-original-import-rpc-generation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-original-import-rpc:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - name: Fix absolute owned generation deadline
        run: |
          echo "OTZARIA_IMPORT_RPC_JOB_DEADLINE=$(( $(date +%s) + 6900 ))" >> "$GITHUB_ENV"
      - name: Checkout reviewed generation control source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/otzaria-original-import-rpc-generation.yml
            /docs/pinkha/torah-integration/native-annotation-import-rpc-generation-20261123/
      - name: Select actual ARM64 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install exact original Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Checkout immutable original Heart
        uses: actions/checkout@v4
        with:
          repository: anyproto/anytype-heart
          ref: d98420b1113536afd08cde6de9a5816f6d27ffff
          path: build/Import-RPC-Inputs/heart
          persist-credentials: false
      - name: Checkout immutable original SDK generator and typed history source
        uses: actions/checkout@v4
        with:
          ref: 997e285617d57b31c4205976f01019819fa29a03
          path: build/Import-RPC-Inputs/swift
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Makefile
            /Scripts/
            /Modules/ProtobufMessages/
            /Modules/Services/
            /Tools/anytype-swift-codegen
            /Tools/anytype-swift-filesplit/
      - name: Checkout exact original SwiftProtobuf source
        uses: actions/checkout@v4
        with:
          repository: apple/swift-protobuf
          ref: c6fe6442e6a64250495669325044052e113e990c
          path: build/Import-RPC-Inputs/swift-protobuf
          persist-credentials: false
      - name: Generate through actual original tools and execute new RPC controls
        run: |
          python3 -I docs/pinkha/torah-integration/native-annotation-import-rpc-generation-20261123/generate_original_import_rpc.py \
            --control-root "$GITHUB_WORKSPACE" \
            --control-head "$GITHUB_SHA" \
            --packet docs/pinkha/torah-integration/native-annotation-import-rpc-generation-20261123 \
            --manifest-sha256 c5950bad223380e20e158c8c824215509b438b02a3678fc885e90f99f982b81b \
            --heart-input build/Import-RPC-Inputs/heart \
            --swift-input build/Import-RPC-Inputs/swift \
            --plugin-input build/Import-RPC-Inputs/swift-protobuf \
            --work build/Import-RPC-Owned-Work \
            --evidence build/Import-RPC-Generation-Evidence \
            --job-deadline-unix "$OTZARIA_IMPORT_RPC_JOB_DEADLINE"
      - name: Retain actual original generated source and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Otzaria-Import-RPC-Generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/Import-RPC-Generation-Evidence
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
