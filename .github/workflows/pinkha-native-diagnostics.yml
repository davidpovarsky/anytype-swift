name: Export existing native XCTest evidence

on:
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  export:
    if: ${{ inputs.source_run_id != '45087682296' }}
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Export actual failed-run screenshots and summaries
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, zipfile
          run = os.environ['SOURCE_RUN_ID']
          if not run.isdigit(): raise RuntimeError('A numeric existing run ID is required')
          root = pathlib.Path('native-diagnostics').resolve()
          root.mkdir()
          subprocess.run(['gh','run','download',run,'--repo',os.environ['GITHUB_REPOSITORY'],
            '-n','Pinkha-Native-Derived-Evidence','-D',str(root/'download')],check=True)
          with zipfile.ZipFile(root/'download/Pinkha-Native-Derived-Evidence.zip') as archive:
            archive.extractall(root/'source')
          for bundle in (root/'source/app').glob('*.xcresult'):
            target = root/bundle.stem
            target.mkdir()
            for mode in ['summary','tests']:
              with (target/(mode+'.json')).open('w') as stream:
                subprocess.run(['xcrun','xcresulttool','get','test-results',mode,
                  '--path',str(bundle),'--format','json'],stdout=stream,check=True)
            subprocess.run(['xcrun','xcresulttool','export','attachments','--path',str(bundle),
              '--output-path',str(target/'attachments')],check=True)
          (root/'source-run.json').write_text(json.dumps(dict(source_run_id=run,
            scope='Existing XCTest evidence only; no test rerun, app build or acceptance inference'),indent=2))
          with zipfile.ZipFile('Pinkha-Native-XCTest-Diagnostics.zip','w',zipfile.ZIP_DEFLATED) as archive:
            for path in root.rglob('*'):
              if path.is_file() and 'source' not in path.relative_to(root).parts and 'download' not in path.relative_to(root).parts:
                archive.write(path,path.relative_to(root))
          PY
      - name: Upload actual XCTest diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-Native-XCTest-Diagnostics
          path: Pinkha-Native-XCTest-Diagnostics.zip
          if-no-files-found: error
          retention-days: 14

  export-any-original:
    if: ${{ inputs.source_run_id == '45087682296' }}
    name: Export original Any UI timeline evidence
    runs-on: xcode-27
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Extract original post-onboarding stills and tap geometry
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python3 -B Tools/AnyEnginePort/export_original_ui_timeline.py
      - name: Preserve bounded original timeline evidence and exact receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Any-Original-UI-Timeline-Evidence-45087682296
          path: build/original-any-ui-timeline-export/selected/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve complete owned renderer process diagnostics separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Any-Original-UI-Timeline-Process-45087682296
          path: |
            build/original-any-ui-timeline-export/private-process/hanlin.stdout.log
            build/original-any-ui-timeline-export/private-process/hanlin.stderr.log
            build/original-any-ui-timeline-export/private-process/hanlin.streams.json
            build/original-any-ui-timeline-export/private-process/hierarchy-drag.stdout.log
            build/original-any-ui-timeline-export/private-process/hierarchy-drag.stderr.log
            build/original-any-ui-timeline-export/private-process/hierarchy-drag.streams.json
          if-no-files-found: warn
          retention-days: 14
