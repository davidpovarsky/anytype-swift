name: Pinkha Hanlin journal platform probe

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable reviewed source SHA
        type: string
        required: true

permissions:
  contents: read

jobs:
  platform-probe:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Checkout the exact reviewed diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Select native ARM64 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Measure actual synthetic UIKit-container filesystem contracts
        run: python3 Tools/Hanlin/run_journal_probe.py --source-sha "$EXPECTED_SOURCE_SHA" --root "$GITHUB_WORKSPACE"
      - name: Preserve diagnostic source identity and original observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-Hanlin-Journal-Probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/hanlin-journal-probe-evidence/
          retention-days: 14
          if-no-files-found: error
