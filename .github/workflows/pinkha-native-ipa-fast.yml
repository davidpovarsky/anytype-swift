name: Pinkha custom Heart fast IPA (build only)
run-name: Pinkha FAST IPA | ${{ github.sha }}

on:
  workflow_call:
    inputs:
      heart_source_run_id:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      heart_source_run_id:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  native-ipa-fast:
    runs-on: macos-15-intel
    timeout-minutes: 110
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Confirm Intel macOS and Xcode 26.3
        run: |
          test "$(uname -m)" = "x86_64"
          xcodebuild -version
          xcodebuild -version | grep -Fq 'Xcode 26.3'
          xcrun --sdk iphoneos --show-sdk-version
      - name: Checkout exact Pinkha source
        uses: actions/checkout@v4

      - name: Install pinned Go toolchain
        if: ${{ inputs.heart_source_run_id == '' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: Modules/PinkhaHeart/go.mod

      - name: Checkout pinned Heart
        if: ${{ inputs.heart_source_run_id == '' }}
        uses: actions/checkout@v4
        with:
          repository: anyproto/anytype-heart
          ref: d98420b1113536afd08cde6de9a5816f6d27ffff
          path: build/Heart-Native-Derived

      - name: Build and verify CUSTOM Heart - skip native tests
        if: ${{ inputs.heart_source_run_id == '' }}
        run: |
          python3 Tools/PinkhaNativeDerived/build_custom_heart.py \
            --heart-source build/Heart-Native-Derived \
            --patch docs/pinkha/torah-integration/evidence/native-derived/8494cfb347/approval/revision-14/native-heart-integration.patch \
            --inventory docs/pinkha/torah-integration/evidence/native-derived/8494cfb347/approval/revision-14/native-heart-integration.json \
            --approved-patch-sha256 fb96818eb57bd9e0be8da90a11831bcccc7ca8e72cc0a4e9a065500feb7cc077 \
            --apply-approved-patch \
            --target ios \
            --skip-native-tests \
            --install-app "$GITHUB_WORKSPACE" \
            --evidence build/fast-ipa-evidence/heart

      - name: Install the exact new framework verified in native acceptance
        if: ${{ inputs.heart_source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_NATIVE_RUN_ID: ${{ inputs.heart_source_run_id }}
        run: |
          [[ "$SOURCE_NATIVE_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$SOURCE_NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Pinkha-Universal-Verified-Heart-r14 --dir build/verified-heart
          python3 Tools/PinkhaNativeDerived/install_verified_heart.py \
            --archive build/verified-heart/Pinkha-Universal-Verified-Heart-r14.tar.gz \
            --inventory docs/pinkha/torah-integration/evidence/native-derived/8494cfb347/approval/revision-14/native-heart-integration.json \
            --patch docs/pinkha/torah-integration/evidence/native-derived/8494cfb347/approval/revision-14/native-heart-integration.patch \
            --app-source "$GITHUB_WORKSPACE" --source-run-id "$SOURCE_NATIVE_RUN_ID" --evidence build/fast-ipa-evidence/heart

      - name: Reuse accepted dependency checkouts and matching Xcode inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            build/native-evidence/app/DerivedData-NativeAcceptance/SourcePackages
            build/native-evidence/app/DerivedData-NativeAcceptance/Build
            build/native-evidence/app/DerivedData-NativeAcceptance/ModuleCache.noindex
            build/native-evidence/app/DerivedData-NativeAcceptance/SDKStatCaches.noindex
          key: pinkha-universal-r13-sim-xcode26.3-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: pinkha-universal-r13-sim-xcode26.3-${{ runner.os }}-${{ runner.arch }}-

      - name: Build device app and package UNSIGNED IPA - NO XCTest
        run: |
          python3 Tools/PinkhaNativeDerived/build_native_ipa_fast.py \
            --app-source "$GITHUB_WORKSPACE" \
            --derived-data "$GITHUB_WORKSPACE/build/native-evidence/app/DerivedData-NativeAcceptance" \
            --evidence build/fast-ipa-evidence/app

      - name: Upload custom Heart trial IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-Custom-Heart-Fast-Unsigned-IPA
          path: build/fast-ipa-evidence/app/Pinkha-Native-Derived-iPad-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build provenance and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-Custom-Heart-Fast-Build-Evidence
          path: |
            build/fast-ipa-evidence/heart/*.json
            build/fast-ipa-evidence/heart/*.log
            build/fast-ipa-evidence/app/*.json
            build/fast-ipa-evidence/app/*.log
          if-no-files-found: warn
          retention-days: 14
