name: Pinkha native derived custom Heart and iPad

on:
  workflow_call:
    inputs:
      heart_source_run_id:
        type: string
        default: ''
      validation_scope:
        type: string
        default: all

permissions:
  contents: read
  actions: read

jobs:
  native-product:
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 150
    steps:
      - name: Checkout isolated native-derived source
        uses: actions/checkout@v4

      - name: Create and boot compatible disposable iPad BEFORE native build
        run: python3 Tools/PinkhaNativeDerived/create_disposable_ipad.py --evidence build/native-evidence

      - name: Install pinned Go toolchain
        if: ${{ inputs.validation_scope != 'failed-ui' && inputs.heart_source_run_id == '' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: Modules/PinkhaHeart/go.mod

      - name: Checkout exact Heart source
        if: ${{ inputs.validation_scope != 'failed-ui' && inputs.heart_source_run_id == '' }}
        uses: actions/checkout@v4
        with:
          repository: anyproto/anytype-heart
          ref: d98420b1113536afd08cde6de9a5816f6d27ffff
          path: build/Heart-Native-Derived

      - name: Build exact custom Heart and install verified slices
        if: ${{ inputs.validation_scope != 'failed-ui' && inputs.heart_source_run_id == '' }}
        run: |
          python3 Tools/PinkhaNativeDerived/build_custom_heart.py \
            --heart-source build/Heart-Native-Derived \
            --patch docs/pinkha/torah-integration/evidence/native-derived/8494cfb347/approval/revision-14/native-heart-integration.patch \
            --inventory docs/pinkha/torah-integration/evidence/native-derived/8494cfb347/approval/revision-14/native-heart-integration.json \
            --approved-patch-sha256 fb96818eb57bd9e0be8da90a11831bcccc7ca8e72cc0a4e9a065500feb7cc077 \
            --apply-approved-patch --target ios --skip-native-tests \
            --install-app "$GITHUB_WORKSPACE" \
            --evidence build/native-evidence/heart

      - name: Download this task's exact verified Heart when requested
        if: ${{ inputs.validation_scope != 'failed-ui' && inputs.heart_source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_NATIVE_RUN_ID: ${{ inputs.heart_source_run_id }}
        run: |
          [[ "$SOURCE_NATIVE_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$SOURCE_NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Pinkha-Universal-Verified-Heart-r14 --dir build/verified-heart
          python3 Tools/PinkhaNativeDerived/install_verified_heart.py \
            --archive build/verified-heart/Pinkha-Universal-Verified-Heart-r14.tar.gz \
            --inventory docs/pinkha/torah-integration/evidence/native-derived/8494cfb347/approval/revision-14/native-heart-integration.json \
            --patch docs/pinkha/torah-integration/evidence/native-derived/8494cfb347/approval/revision-14/native-heart-integration.patch \
            --app-source "$GITHUB_WORKSPACE" --source-run-id "$SOURCE_NATIVE_RUN_ID" --evidence build/native-evidence/heart

      - name: Reuse identical accepted headers for the Swift cache - NEVER old binaries
        if: ${{ inputs.validation_scope == 'readonly-startup' && inputs.heart_source_run_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42740484502 --repo "$GITHUB_REPOSITORY" --name Pinkha-Universal-Verified-Heart-r13 --dir build/previous-header-inputs
          python3 Tools/PinkhaNativeDerived/reuse_matching_framework_headers.py \
            --app-source "$GITHUB_WORKSPACE" \
            --previous-archive build/previous-header-inputs/Pinkha-Universal-Verified-Heart-r13.tar.gz \
            --evidence build/native-evidence/heart

      - name: Preserve the NEW verified native framework for focused app reruns
        if: ${{ inputs.validation_scope != 'failed-ui' && inputs.heart_source_run_id == '' }}
        run: tar -czf build/Pinkha-Universal-Verified-Heart-r14.tar.gz -C Dependencies/Middleware Lib.xcframework PinkhaNativeHeartBuild.json

      - name: Upload exact verified new Heart
        if: ${{ inputs.validation_scope != 'failed-ui' && inputs.heart_source_run_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-Universal-Verified-Heart-r14
          path: build/Pinkha-Universal-Verified-Heart-r14.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Restore focused Xcode build cache
        id: native-app-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/native-evidence/app/DerivedData-NativeAcceptance/SourcePackages
            build/native-evidence/app/DerivedData-NativeAcceptance/Build
            build/native-evidence/app/DerivedData-NativeAcceptance/ModuleCache.noindex
            build/native-evidence/app/DerivedData-NativeAcceptance/SDKStatCaches.noindex
          key: pinkha-universal-r13-sim-xcode26.3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.validation_scope == 'readonly-startup' && 'dee60eef8395a8a92998f08d7e7eb66701e7febc' || inputs.validation_scope == 'failed-ui' && '8258841dab25764c0d9cfe3bee7eec566995f79d' || github.sha }}
          restore-keys: pinkha-universal-r13-sim-xcode26.3-${{ runner.os }}-${{ runner.arch }}-

      - name: Retry exact accepted app cache after a transient download failure
        if: ${{ inputs.validation_scope == 'failed-ui' && hashFiles('build/native-evidence/app/DerivedData-NativeAcceptance/Build/PinkhaSourceInputs.json') == '' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            build/native-evidence/app/DerivedData-NativeAcceptance/SourcePackages
            build/native-evidence/app/DerivedData-NativeAcceptance/Build
            build/native-evidence/app/DerivedData-NativeAcceptance/ModuleCache.noindex
            build/native-evidence/app/DerivedData-NativeAcceptance/SDKStatCaches.noindex
          key: pinkha-universal-r13-sim-xcode26.3-${{ runner.os }}-${{ runner.arch }}-8258841dab25764c0d9cfe3bee7eec566995f79d

      - name: Focused real native product and original UI tests
        id: native-app
        if: ${{ inputs.validation_scope != 'failed-ui' }}
        env:
          NATIVE_SCOPE: ${{ inputs.validation_scope }}
        run: |
          args=()
          if [[ "$NATIVE_SCOPE" == 'readonly-startup' ]]; then
            args+=(--reuse-policy-and-header-from-run 42740484502 --relink-verified-swift-from-run 42740484502)
          fi
          python3 Tools/PinkhaNativeDerived/build_native_ipa.py \
            --app-source "$GITHUB_WORKSPACE" --tests-only \
            --simulator-udid "$PINKHA_NATIVE_IPAD_UDID" \
            --evidence build/native-evidence/app "${args[@]}"

      - name: Resume only failed UI cases using accepted app - NO app build
        if: ${{ inputs.validation_scope == 'failed-ui' }}
        run: |
          python3 Tools/PinkhaNativeDerived/rerun_original_ui.py \
            --app-source "$GITHUB_WORKSPACE" \
            --simulator-udid "$PINKHA_NATIVE_IPAD_UDID" \
            --evidence build/native-evidence/app

      - name: Package native build and test evidence
        if: always()
        run: python3 Tools/PinkhaNativeDerived/package_evidence.py build/native-evidence

      - name: Upload native build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-Native-Derived-Evidence
          path: build/native-evidence/Pinkha-Native-Derived-Evidence.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve focused Xcode cache after build or test failure
        if: ${{ always() && steps.native-app.outcome != 'skipped' && (steps.native-app-cache.outputs.cache-hit != 'true' || (inputs.validation_scope == 'readonly-startup' && hashFiles('build/native-evidence/app/relinked-simulator.json') != '')) }}
        uses: actions/cache/save@v4
        with:
          path: |
            build/native-evidence/app/DerivedData-NativeAcceptance/SourcePackages
            build/native-evidence/app/DerivedData-NativeAcceptance/Build
            build/native-evidence/app/DerivedData-NativeAcceptance/ModuleCache.noindex
            build/native-evidence/app/DerivedData-NativeAcceptance/SDKStatCaches.noindex
          key: pinkha-universal-r13-sim-xcode26.3-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
