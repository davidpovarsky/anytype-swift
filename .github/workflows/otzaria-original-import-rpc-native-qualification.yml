name: Original Import RPC native qualification

on:
  push:
    branches:
      - codex/otzaria-import-rpc-native-qualification-20261123

permissions:
  contents: read
  actions: read

concurrency:
  group: otzaria-original-import-rpc-native-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-original-import-rpc:
    if: ${{ github.run_attempt == 1 }}
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fix absolute owned qualification deadline
        run: |
          echo "OTZARIA_IMPORT_RPC_JOB_DEADLINE=$(( $(date +%s) + 6900 ))" >> "$GITHUB_ENV"
      - name: Checkout exact native qualification source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/otzaria-original-import-rpc-native-qualification.yml
            /Tools/OriginalEditor/ImportRPC/
            /docs/pinkha/torah-integration/native-annotation-import-rpc-generation-20261123/
      - name: Select actual ARM64 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install exact original Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Checkout immutable original Heart
        uses: actions/checkout@v4
        with:
          repository: anyproto/anytype-heart
          ref: d98420b1113536afd08cde6de9a5816f6d27ffff
          path: build/Import-RPC-Inputs/heart
          persist-credentials: false
      - name: Reuse actual generation and execute missing native RPC controls
        run: |
          python3 -I Tools/OriginalEditor/ImportRPC/qualify_original_import_rpc.py \
            --control-root "$GITHUB_WORKSPACE" \
            --control-head "$GITHUB_SHA" \
            --packet docs/pinkha/torah-integration/native-annotation-import-rpc-generation-20261123 \
            --manifest-sha256 c5950bad223380e20e158c8c824215509b438b02a3678fc885e90f99f982b81b \
            --pin Tools/OriginalEditor/ImportRPC/native-qualification-pin.json \
            --pin-sha256 4e821b02540f184eadce616a8753e9da92a39461a622c91da52419128b2105ec \
            --heart-input build/Import-RPC-Inputs/heart \
            --work build/Import-RPC-Native-Qualification-Owned-Work \
            --evidence build/Import-RPC-Native-Qualification-Evidence \
            --job-deadline-unix "$OTZARIA_IMPORT_RPC_JOB_DEADLINE"
      - name: Retain actual generated bytes and native RPC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Otzaria-Import-RPC-Native-Qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/Import-RPC-Native-Qualification-Evidence
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
