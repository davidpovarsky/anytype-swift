name: Build the distinct Page154 semantic anchor Apple runtime

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  page154-production-simulator:
    runs-on: xcode-27
    timeout-minutes: 110
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      ATTEMPT: build/semantic-page154-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout the exact reviewed Page154 producer and original native evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: build/semantic-page154-${{ github.run_id }}-${{ github.run_attempt }}/control
          persist-credentials: false
      - name: Checkout the original clean native base
        uses: actions/checkout@v4
        with:
          repository: anyproto/anytype-heart
          ref: d98420b1113536afd08cde6de9a5816f6d27ffff
          path: build/semantic-page154-${{ github.run_id }}-${{ github.run_attempt }}/heart
          persist-credentials: false
      - name: Select native ARM64 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Select the exact Go compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Retain the original Page2 passes and build one new production simulator framework
        run: |
          python3 -B "$ATTEMPT/control/Tools/PinkhaSemanticAnchorWire/apple_runtime/build.py" \
            --control "$ATTEMPT/control" --heart-source "$ATTEMPT/heart" --work "$ATTEMPT/work" \
            --evidence "$ATTEMPT/evidence" --artifacts "$ATTEMPT/artifacts" \
            --expected-app-sha "$GITHUB_SHA"
      - name: Preserve the distinct Page154 production framework
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-Semantic-Page-Production-Simulator-v1
          path: build/semantic-page154-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/Pinkha-Semantic-Page-Production-Simulator-v1.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve the source native lineage and actual generated header symbol and Swift checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-Semantic-Page-Apple-Runtime-Proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/semantic-page154-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          retention-days: 14
          if-no-files-found: error
