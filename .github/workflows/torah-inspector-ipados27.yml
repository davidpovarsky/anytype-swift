name: Torah Associations iPadOS 27 Update

on:
  push:
    branches:
      - pinkha/torah-associations-native-ux-persistence-localization-2026-10-20
  workflow_dispatch:

concurrency:
  group: torah-inspector-ipados27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: xcode-27
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          mkdir -p build/evidence
          xcodebuild -version | tee build/evidence/xcode-version.txt
          xcodebuild -showsdks | tee build/evidence/xcode-sdks.txt
          swift --version | tee build/evidence/swift-version.txt

      - name: Verify immutable TorahInspectorKit pins
        run: |
          test "$(grep -c 'a2fa3a528ac2bccfa00ed206d7954083077fc847' Modules/PinkhaKit/Package.swift)" -eq 1
          test "$(grep -c 'a2fa3a528ac2bccfa00ed206d7954083077fc847' Anytype.xcodeproj/project.pbxproj)" -eq 1
          grep -q 'productName = TorahInspectorUI' Anytype.xcodeproj/project.pbxproj

      - name: Verify production Torah feature has no trial mutation gate
        run: |
          if grep -R -n -E 'mutationOptIn|mutationGate|DISPOSABLE|disposableSpaceConfirmed|freshDocumentConfirmed|mutationIsAuthorized|Activate experimental writing|T2-L safety' \
            Anytype/Sources/Pinkha/Torah \
            Anytype/Sources/PresentationLayer/TextEditor/EditorPage \
            AnyTypeTests/Pinkha; then
            echo 'Obsolete trial mutation gate remains in compiled feature code.' >&2
            exit 1
          fi

      - name: Verify localization catalog and generated accessors
        run: |
          python3 -m json.tool Modules/Loc/Sources/Loc/Resources/Workspace.xcstrings > /dev/null
          grep -q 'public enum Torah' Modules/Loc/Sources/Loc/Generated/Strings.swift
          grep -q 'Pinkha.Torah.searchType' Modules/Loc/Sources/Loc/Generated/Strings.swift

      - name: Verify native UI parity source contracts
        run: |
          grep -q 'SearchViewShell' Anytype/Sources/PresentationLayer/Common/SwiftUI/Search/Common/SearchView/SearchView.swift
          grep -q 'SearchViewShell' Anytype/Sources/Pinkha/Torah/UI/TorahSourcesSearchView.swift
          ! grep -q 'presentationDetents' Anytype/Sources/Pinkha/Torah/UI/TorahEditorHostModifier.swift
          ! grep -q 'overlay(alignment: .topTrailing)' Anytype/Sources/Pinkha/Torah/UI/TorahEditorHostModifier.swift
          ! grep -q 'UICellAccessory' Anytype/Sources/PresentationLayer/TextEditor/EditorPage/EditorPageController.swift
          grep -q 'additionalMenuItems' Anytype/Sources/PresentationLayer/TextEditor/EditorPage/Utils/EditorNavigationBarHelper/EditorNavigationBarHelper.swift

      - name: Run TorahInspectorKit tests
        id: torahinspectorkit_tests
        continue-on-error: true
        run: |
          git clone --quiet https://github.com/davidpovarsky/TorahInspectorKit.git build/TorahInspectorKit
          git -C build/TorahInspectorKit checkout --quiet a2fa3a528ac2bccfa00ed206d7954083077fc847
          swift test --package-path build/TorahInspectorKit 2>&1 | tee build/evidence/torahinspectorkit-tests.log

      - name: Run PinkhaKit tests
        id: pinkhakit_tests
        continue-on-error: true
        run: swift test --package-path Modules/PinkhaKit 2>&1 | tee build/evidence/pinkhakit-tests.log

      - name: Download middleware
        run: make setup-middle-ci
        env:
          CI: 'true'
          MIDDLEWARE_TOKEN: ${{ secrets.MIDDLEWARE_TOKEN }}

      - name: Select iPhone and iPad simulators on iOS 27
        run: |
          xcrun simctl list devices available --json > build/evidence/simulators.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('build/evidence/simulators.json'))
          iphones = []
          ipads = []
          for runtime, devices in data['devices'].items():
              if 'iOS-27' not in runtime:
                  continue
              iphones.extend(d for d in devices if d.get('isAvailable') and d['name'].startswith('iPhone'))
              ipads.extend(d for d in devices if d.get('isAvailable') and 'iPad' in d['name'])
          if not iphones or not ipads:
              raise SystemExit('Both an iPhone and iPad simulator on iOS 27 are required')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"IPHONE_UDID={iphones[0]['udid']}\n")
              env.write(f"IPHONE_NAME={iphones[0]['name']}\n")
              env.write(f"IPAD_UDID={ipads[0]['udid']}\n")
              env.write(f"IPAD_NAME={ipads[0]['name']}\n")
          with open('build/evidence/selected-simulators.txt', 'w') as output:
              output.write(f"iPhone: {iphones[0]['name']} ({iphones[0]['udid']})\n")
              output.write(f"iPad: {ipads[0]['name']} ({ipads[0]['udid']})\n")
          PY

      - name: Build focused native tests once
        id: native_build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build/results
          # Simulator signing must stay enabled because the real-app preparation exercises
          # the production Keychain login lifecycle. The device IPA remains unsigned below.
          xcodebuild build-for-testing \
            -project Anytype.xcodeproj \
            -scheme Anytype \
            -configuration Debug-Anytype \
            -destination "platform=iOS Simulator,id=$IPAD_UDID" \
            -derivedDataPath build/DerivedData-Tests \
            -collect-test-diagnostics never \
            -parallel-testing-enabled NO \
            -only-testing:AnytypeTests/BlockInformationConverterFieldsTests \
            -only-testing:AnytypeTests/PinkhaTextDirectionPersistenceTests \
            -only-testing:AnytypeTests/PinkhaTextDirectionUIKitAdapterTests \
            -only-testing:AnytypeTests/PinkhaTextBlockLeadingMarkerAdapterTests \
            -only-testing:AnytypeTests/PinkhaNavigationGestureBridgeTests \
            -only-testing:AnytypeTests/PinkhaStage1AcceptancePreparationTests \
            -only-testing:AnytypeTests/TorahAssociationNativeRepositoryTests \
            -only-testing:AnytypeTests/TorahNativeUIParityTests \
            -only-testing:AnytypeTests/TorahSearchLayoutTests \
            -only-testing:AnytypeTests/TorahSearchLayoutScreenshotTests \
            2>&1 | tee build/evidence/native-build-for-testing.log

      - name: Run focused native tests on iPhone and iPad in LTR and RTL
        id: native_tests
        if: steps.native_build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          test_flags=(
            -only-testing:AnytypeTests/BlockInformationConverterFieldsTests
            -only-testing:AnytypeTests/PinkhaTextDirectionPersistenceTests
            -only-testing:AnytypeTests/PinkhaTextDirectionUIKitAdapterTests
            -only-testing:AnytypeTests/PinkhaTextBlockLeadingMarkerAdapterTests
            -only-testing:AnytypeTests/PinkhaNavigationGestureBridgeTests
            -only-testing:AnytypeTests/TorahAssociationNativeRepositoryTests
            -only-testing:AnytypeTests/TorahNativeUIParityTests
            -only-testing:AnytypeTests/TorahSearchLayoutTests
            -only-testing:AnytypeTests/TorahSearchLayoutScreenshotTests
          )
          run_native_tests() {
            local device_kind="$1"
            local udid="$2"
            local direction="$3"
            local language="$4"
            local region="$5"
            local result="build/results/${device_kind}-${direction}.xcresult"
            local log="build/evidence/native-${device_kind}-${direction}.log"
            local run_status=1
            for attempt in 1 2; do
              case "$result" in
                build/results/*.xcresult) rm -rf -- "$result" ;;
                *) echo "Refusing to remove unexpected result path: $result"; exit 1 ;;
              esac
              local attempt_log="build/evidence/native-${device_kind}-${direction}-attempt-${attempt}.log"
              set +e
              xcodebuild test-without-building \
                -project Anytype.xcodeproj \
                -scheme Anytype \
                -configuration Debug-Anytype \
                -destination "platform=iOS Simulator,id=$udid" \
                -derivedDataPath build/DerivedData-Tests \
                -resultBundlePath "$result" \
                -collect-test-diagnostics never \
                -parallel-testing-enabled NO \
                -testLanguage "$language" \
                -testRegion "$region" \
                "${test_flags[@]}" \
                2>&1 | tee "$attempt_log"
              run_status=${PIPESTATUS[0]}
              set -e
              cp "$attempt_log" "$log"
              if [[ $run_status -eq 0 ]]; then
                break
              fi
              if [[ $attempt -eq 1 ]] && grep -Fq "test runner hung before establishing connection" "$attempt_log"; then
                echo "Retrying once after simulator test-runner infrastructure failure."
                xcrun simctl shutdown "$udid" || true
                xcrun simctl boot "$udid"
                xcrun simctl bootstatus "$udid" -b
              else
                break
              fi
            done
            if [[ $run_status -ne 0 ]]; then
              status=1
            fi
          }
          run_native_tests iphone "$IPHONE_UDID" ltr en US
          run_native_tests iphone "$IPHONE_UDID" rtl he IL
          run_native_tests ipad "$IPAD_UDID" ltr en US
          run_native_tests ipad "$IPAD_UDID" rtl he IL
          exit "$status"

      - name: Validate native result bundles and aggregate counts
        id: native_counts
        if: always() && steps.native_build.outcome == 'success'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = [
              'iphone-ltr', 'iphone-rtl', 'ipad-ltr', 'ipad-rtl'
          ]
          aggregate = {'total': 0, 'passed': 0, 'failed': 0, 'skipped': 0, 'runs': {}}
          problems = []
          for name in expected:
              bundle = Path('build/results', name + '.xcresult')
              if not bundle.is_dir():
                  problems.append(f'missing {bundle}')
                  continue
              raw = subprocess.check_output([
                  'xcrun', 'xcresulttool', 'get', 'test-results', 'summary',
                  '--path', str(bundle), '--format', 'json'
              ], text=True)
              summary = json.loads(raw)
              def integer_value(key):
                  stack = [summary]
                  while stack:
                      value = stack.pop()
                      if isinstance(value, dict):
                          candidate = value.get(key)
                          if isinstance(candidate, int):
                              return candidate
                          stack.extend(value.values())
                      elif isinstance(value, list):
                          stack.extend(value)
                  return 0
              counts = {
                  'total': integer_value('totalTestCount'),
                  'passed': integer_value('passedTests'),
                  'failed': integer_value('failedTests'),
                  'skipped': integer_value('skippedTests'),
              }
              aggregate['runs'][name] = counts
              for key in ('total', 'passed', 'failed', 'skipped'):
                  aggregate[key] += counts[key]
              if counts['total'] < 20:
                  problems.append(f'{name} executed only {counts["total"]} tests')
              if counts['failed'] or counts['skipped'] or counts['passed'] != counts['total']:
                  problems.append(f'{name} counts are not all-pass: {counts}')

          Path('build/evidence/native-test-counts.json').write_text(
              json.dumps(aggregate, indent=2, sort_keys=True) + '\n',
              encoding='utf-8'
          )
          with Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).open('a') as output:
              output.write('## Stage 1 native simulator matrix\n\n')
              for name, counts in aggregate['runs'].items():
                  output.write(f'- `{name}`: {counts}\n')
              output.write(f'- aggregate: total={aggregate["total"]}, passed={aggregate["passed"]}, failed={aggregate["failed"]}, skipped={aggregate["skipped"]}\n')
          if problems:
              raise SystemExit('; '.join(problems))
          PY

      - name: Build Release real-app acceptance sequence
        id: release_acceptance_build
        continue-on-error: true
        run: |
          set -o pipefail
          # Build both test targets into one xctestrun. Running them through this scheme
          # keeps the Release app installation and container intact between preparation
          # and the UI assertion instead of reinstalling the app between invocations.
          xcodebuild build-for-testing \
            -workspace PinkhaStage1Acceptance/PinkhaStage1Acceptance.xcworkspace \
            -scheme PinkhaStage1Acceptance \
            -configuration Release-Anytype \
            -destination "platform=iOS Simulator,id=$IPAD_UDID" \
            -derivedDataPath build/DerivedData-Release-Acceptance \
            -collect-test-diagnostics never \
            -parallel-testing-enabled NO \
            -only-testing:AnytypeTests/PinkhaStage1AcceptancePreparationTests \
            -only-testing:PinkhaStage1AcceptanceUITests/PinkhaStage1AcceptanceUITests \
            ENABLE_TESTABILITY=YES \
            2>&1 | tee build/evidence/release-real-app-sequence-build.log

      - name: Run Release real-app acceptance on iPhone LTR and iPad RTL
        id: release_acceptance
        if: steps.release_acceptance_build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          run_real_app_acceptance() {
            local device_kind="$1"
            local udid="$2"
            local direction="$3"
            local language="$4"
            local region="$5"
            local result="build/results/release-${device_kind}-${direction}.xcresult"
            local log="build/evidence/release-${device_kind}-${direction}.log"

            # Native checks installed a Debug build earlier. Start this acceptance run
            # with a clean, isolated Release container; Xcode then keeps that one install
            # for the preparation test and the UI test in the same invocation.
            xcrun simctl uninstall "$udid" io.anytype.app || true
            xcrun simctl uninstall "$udid" io.anytype.app.dev || true

            set +e
            PINKHA_ACCEPTANCE_DIRECTION="$direction" xcodebuild test-without-building \
              -workspace PinkhaStage1Acceptance/PinkhaStage1Acceptance.xcworkspace \
              -scheme PinkhaStage1Acceptance \
              -configuration Release-Anytype \
              -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath build/DerivedData-Release-Acceptance \
              -resultBundlePath "$result" \
              -collect-test-diagnostics never \
              -parallel-testing-enabled NO \
              -testLanguage "$language" \
              -testRegion "$region" \
              -only-testing:AnytypeTests/PinkhaStage1AcceptancePreparationTests \
              -only-testing:PinkhaStage1AcceptanceUITests/PinkhaStage1AcceptanceUITests \
              ENABLE_TESTABILITY=YES \
              2>&1 | tee "$log"
            local run_status=${PIPESTATUS[0]}
            set -e
            if [[ $run_status -ne 0 ]]; then
              status=1
            fi
          }
          run_real_app_acceptance iphone "$IPHONE_UDID" ltr en US
          run_real_app_acceptance ipad "$IPAD_UDID" rtl he IL
          exit "$status"

      - name: Validate and export real-app acceptance evidence
        id: release_acceptance_evidence
        if: always() && steps.release_acceptance_build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p build/evidence/real-app-screenshots
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = [
              'release-iphone-ltr',
              'release-ipad-rtl',
          ]
          aggregate = {'total': 0, 'passed': 0, 'failed': 0, 'skipped': 0, 'runs': {}}
          problems = []
          for name in expected:
              bundle = Path('build/results', name + '.xcresult')
              if not bundle.is_dir():
                  problems.append(f'missing {bundle}')
                  continue
              raw = subprocess.check_output([
                  'xcrun', 'xcresulttool', 'get', 'test-results', 'summary',
                  '--path', str(bundle), '--format', 'json'
              ], text=True)
              summary = json.loads(raw)
              def integer_value(key):
                  stack = [summary]
                  while stack:
                      value = stack.pop()
                      if isinstance(value, dict):
                          candidate = value.get(key)
                          if isinstance(candidate, int):
                              return candidate
                          stack.extend(value.values())
                      elif isinstance(value, list):
                          stack.extend(value)
                  return 0
              counts = {
                  'total': integer_value('totalTestCount'),
                  'passed': integer_value('passedTests'),
                  'failed': integer_value('failedTests'),
                  'skipped': integer_value('skippedTests'),
              }
              aggregate['runs'][name] = counts
              for key in ('total', 'passed', 'failed', 'skipped'):
                  aggregate[key] += counts[key]
              if counts['total'] != 2 or counts['passed'] != 2 or counts['failed'] or counts['skipped']:
                  problems.append(f'{name} is not exactly two passing tests: {counts}')

          Path('build/evidence/real-app-test-counts.json').write_text(
              json.dumps(aggregate, indent=2, sort_keys=True) + '\n',
              encoding='utf-8'
          )
          if problems:
              raise SystemExit('; '.join(problems))
          PY
          for result in build/results/release-*.xcresult; do
            name="$(basename "$result" .xcresult)"
            xcrun xcresulttool export attachments \
              --path "$result" \
              --output-path "build/evidence/real-app-screenshots/$name"
          done

      - name: Build unsigned iPad device app
        id: device_build
        run: |
          set -o pipefail
          # The simulator matrix and real-app acceptance have already exported their
          # xcresults and screenshots. Reclaim only their derived products before the
          # independent iphoneos build so the Xcode 27 runner cannot exhaust its disk.
          for target in \
            "$GITHUB_WORKSPACE/build/DerivedData-Tests" \
            "$GITHUB_WORKSPACE/build/DerivedData-Release-Acceptance" \
            "$GITHUB_WORKSPACE/build/TorahInspectorKit/.build" \
            "$GITHUB_WORKSPACE/Modules/PinkhaKit/.build"; do
            case "$target" in
              "$GITHUB_WORKSPACE/build/DerivedData-Tests"|\
              "$GITHUB_WORKSPACE/build/DerivedData-Release-Acceptance"|\
              "$GITHUB_WORKSPACE/build/TorahInspectorKit/.build"|\
              "$GITHUB_WORKSPACE/Modules/PinkhaKit/.build") rm -rf -- "$target" ;;
              *) echo "Refusing to remove unexpected path: $target" >&2; exit 1 ;;
            esac
          done
          df -h "$GITHUB_WORKSPACE"
          xcodebuild build \
            -project Anytype.xcodeproj \
            -scheme Anytype \
            -configuration Release-Anytype \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData-Device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build/evidence/device-build.log

      - name: Package same-sandbox unsigned IPA update
        id: package_ipa
        if: steps.device_build.outcome == 'success'
        run: |
          APP_PATH='build/DerivedData-Device/Build/Products/Release-Anytype-iphoneos/Anytype.app'
          test -d "$APP_PATH"
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          plist = Path('build/DerivedData-Device/Build/Products/Release-Anytype-iphoneos/Anytype.app/Info.plist')
          with plist.open('rb') as stream:
              info = plistlib.load(stream)
          info['CFBundleIdentifier'] = 'com.gloiiire.anytype.torahtrial'
          info['CFBundleDisplayName'] = 'Anytype Torah'
          info['PinkhaBuildCommit'] = '${{ github.sha }}'
          info['PinkhaBuildConfiguration'] = 'Release-Anytype'
          info['PinkhaAcceptanceRun'] = '${{ github.run_id }}'
          with plist.open('wb') as stream:
              plistlib.dump(info, stream, fmt=plistlib.FMT_BINARY)
          PY
          if [[ -d "$APP_PATH/PlugIns" ]]; then
            rm -rf "$APP_PATH/PlugIns"
          fi
          plutil -p "$APP_PATH/Info.plist" | tee build/evidence/packaged-info-plist.txt
          cp Anytype/Anytype.entitlements build/evidence/original-release-entitlements-not-applied.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          app = Path('build/DerivedData-Device/Build/Products/Release-Anytype-iphoneos/Anytype.app')
          with (app / 'Info.plist').open('rb') as stream:
              info = plistlib.load(stream)
          assert info['CFBundleIdentifier'] == 'com.gloiiire.anytype.torahtrial'
          assert info['CFBundleDisplayName'] == 'Anytype Torah'
          assert info['PinkhaBuildCommit'] == '${{ github.sha }}'
          assert info['PinkhaBuildConfiguration'] == 'Release-Anytype'
          assert info['PinkhaAcceptanceRun'] == '${{ github.run_id }}'
          assert 2 in info['UIDeviceFamily'], info['UIDeviceFamily']
          assert info.get('MinimumOSVersion'), 'MinimumOSVersion is missing'
          assert not (app / 'PlugIns').exists(), 'Embedded extensions were not removed'
          assert not (app / '_CodeSignature').exists(), 'Code signature directory is present'
          Path('build/evidence/package-audit.txt').write_text(
              'Bundle ID: ' + info['CFBundleIdentifier'] + '\n'
              'Display name: ' + info['CFBundleDisplayName'] + '\n'
              'UIDeviceFamily: ' + repr(info['UIDeviceFamily']) + '\n'
              'MinimumOSVersion: ' + info['MinimumOSVersion'] + '\n'
              'PinkhaBuildCommit: ' + info['PinkhaBuildCommit'] + '\n'
              'PinkhaBuildConfiguration: ' + info['PinkhaBuildConfiguration'] + '\n'
              'PinkhaAcceptanceRun: ' + info['PinkhaAcceptanceRun'] + '\n'
              'Embedded PlugIns: absent\n'
              'Build entitlements override: empty\n',
              encoding='utf-8'
          )
          PY
          if codesign -d --entitlements :- "$APP_PATH" > build/evidence/codesign-audit.txt 2>&1; then
            echo 'Unexpected code signature on unsigned app update' >&2
            exit 1
          else
            printf '\nExpected result: app is unsigned and has no embedded signing entitlements.\n' \
              >> build/evidence/codesign-audit.txt
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/AnytypeTorah.app
          ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload build/ipa/Anytype-Torah-iPadOS27-Unsigned.ipa
          shasum -a 256 build/ipa/Anytype-Torah-iPadOS27-Unsigned.ipa | tee build/evidence/ipa-sha256.txt
          printf 'Anytype commit: %s\nTorahInspectorKit commit: %s\nBundle ID: %s\n' \
            "$GITHUB_SHA" \
            'a2fa3a528ac2bccfa00ed206d7954083077fc847' \
            'com.gloiiire.anytype.torahtrial' \
            > build/evidence/manifest.txt

      - name: Upload unsigned IPA
        if: steps.package_ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Anytype-Torah-iPadOS27-Unsigned-IPA
          path: build/ipa/Anytype-Torah-iPadOS27-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TorahInspector-iPadOS27-Test-Results
          path: build/results
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare runtime evidence documents
        if: always()
        run: |
          cp docs/pinkha/torah-integration/EMBEDDED_SEARCH_ACCEPTANCE_MATRIX_2026-10-25.md build/evidence/acceptance-matrix.md
          cp docs/pinkha/torah-integration/EMBEDDED_SEARCH_SCREENSHOT_STATUS_2026-10-25.md build/evidence/screenshot-status.md
          printf '\n## CI identity\n\n- Run: %s\n- Anytype commit: `%s`\n- TorahInspectorKit commit: `%s`\n' \
            "$GITHUB_RUN_ID" \
            "$GITHUB_SHA" \
            'a2fa3a528ac2bccfa00ed206d7954083077fc847' \
            >> build/evidence/acceptance-matrix.md
          printf '\n## CI identity\n\n- Run: %s\n- Anytype commit: `%s`\n- TorahInspectorKit commit: `%s`\n' \
            "$GITHUB_RUN_ID" \
            "$GITHUB_SHA" \
            'a2fa3a528ac2bccfa00ed206d7954083077fc847' \
            >> build/evidence/screenshot-status.md

      - name: Upload acceptance matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TorahInspector-iPadOS27-Acceptance-Matrix
          path: build/evidence/acceptance-matrix.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload screenshot status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TorahInspector-iPadOS27-Screenshot-Status
          path: build/evidence/screenshot-status.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TorahInspector-iPadOS27-Logs
          path: build/evidence
          if-no-files-found: error
          retention-days: 14

      - name: Enforce test outcomes after publishing evidence
        if: always() && (steps.torahinspectorkit_tests.outcome != 'success' || steps.pinkhakit_tests.outcome != 'success' || steps.native_build.outcome != 'success' || steps.native_tests.outcome != 'success' || steps.native_counts.outcome != 'success' || steps.release_acceptance_build.outcome != 'success' || steps.release_acceptance.outcome != 'success' || steps.release_acceptance_evidence.outcome != 'success')
        run: |
          echo "At least one test stage failed; artifacts above remain available for diagnosis."
          exit 1
