name: Pinkha Stage 1 Manual Dispatcher
run-name: Pinkha ${{ inputs.route }} · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      route:
        description: Stage 1 route to run
        type: choice
        required: true
        options:
          - full-acceptance
          - ipa-only
          - native-derived
          - native-diagnostics
      source_run_id:
        description: Existing native run whose XCTest attachments should be exported
        type: string
        default: ''
      require_full_acceptance:
        description: Require Full Acceptance success before IPA packaging
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  native-diagnostics:
    if: ${{ inputs.route == 'native-diagnostics' }}
    uses: ./.github/workflows/pinkha-native-diagnostics.yml
    with:
      source_run_id: ${{ inputs.source_run_id }}

  native-derived:
    if: ${{ inputs.route == 'native-derived' }}
    uses: ./.github/workflows/pinkha-native-derived.yml
    secrets: inherit

  full-acceptance:
    if: ${{ inputs.route == 'full-acceptance' }}
    uses: ./.github/workflows/pinkha-full-acceptance.yml
    secrets: inherit

  ipa-only:
    if: ${{ inputs.route == 'ipa-only' }}
    uses: ./.github/workflows/pinkha-ipa-only.yml
    with:
      require_full_acceptance: ${{ inputs.require_full_acceptance }}
    secrets: inherit
