          Tools/AnyEngineValidation/native_whole_source
          Tools/AnyEngineValidation/loaded_account_witness/portable
    - name: Compile once and execute native JSON plus three real peer processes
      run: python3 Tools/AnyEngineValidation/native_file_peer/run_native.py
    - name: Preserve original native JSON and peer result with encrypted evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-file-peer-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pinkha-native-file-peer/public
        if-no-files-found: error
        retention-days: 90
