  owned-simulator-inventory-diagnostic:
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      EVIDENCE: build/owned-simulator-inventory-${{ github.run_id }}-${{ github.run_attempt }}
      GIT_OPTIONAL_LOCKS: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    if: ${{ inputs.route == 'owned-simulator-inventory-diagnostic' }}
    runs-on: xcode-27
    steps:
    - name: Checkout only the exact diagnostic source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false
        ref: ${{ github.sha }}
        sparse-checkout: |-
          AGENTS.md
          Tools/SimulatorBootInventoryDiagnostic
          .github/workflows/pinkha-owned-simulator-inventory-diagnostic.yml
        sparse-checkout-cone-mode: false
    - name: Bind the dispatched branch without advancing its commit
      run: |-
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$GITHUB_REF" = "refs/heads/$GITHUB_REF_NAME"
        test "$GITHUB_REF_NAME" = "codex/chatgpt-wave15-shared-20261121"
        current_branch="$(git branch --show-current)"
        if [ -z "$current_branch" ]; then
          git switch -c "$GITHUB_REF_NAME"
        else
          test "$current_branch" = "$GITHUB_REF_NAME"
        fi
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      shell: bash
    - name: Select an already installed ARM64 Python without downloading a runtime
      run: |-
        set -euo pipefail
        shopt -s nullglob
        candidates=()
        default_python="$(command -v python3 || true)"
        if [ -n "$default_python" ]; then candidates+=("$default_python"); fi
        if [ -n "${RUNNER_TOOL_CACHE:-}" ]; then
          for candidate in "$RUNNER_TOOL_CACHE"/Python/3.12.*/arm64/bin/python3; do
            candidates+=("$candidate")
          done
        fi
        test "${#candidates[@]}" -gt 0
        test "${#candidates[@]}" -le 12
        selected=''
        for candidate in "${candidates[@]}"; do
          if "$candidate" -I -B -c 'import platform,sys; assert sys.version_info[:2] == (3,12) and platform.machine() == "arm64"' >/dev/null 2>&1; then
            selected="$candidate"
            break
          fi
        done
        test -n "$selected"
        printf 'DIAGNOSTIC_PYTHON=%s\n' "$selected" >> "$GITHUB_ENV"
        "$selected" -I -B -c 'import platform,sys; print(sys.executable); print(sys.version); print(platform.machine())'
