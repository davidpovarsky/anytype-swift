name: Original editor framework external import and resources

on:
  push:
    branches:
      - codex/otzaria-original-editor-shared-framework-20261123

permissions:
  contents: read
  actions: read

concurrency:
  group: original-editor-framework-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-editor-framework:
    if: github.repository == 'davidpovarsky/anytype-swift' && github.event_name == 'push' && github.ref == 'refs/heads/codex/otzaria-original-editor-shared-framework-20261123'
    runs-on: xcode-27
    timeout-minutes: 140
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      EXPECTED_APP_BRANCH: codex/otzaria-original-editor-shared-framework-20261123
      HEART_SOURCE_RUN_ID: '44203168617'
      EDITOR_EVIDENCE: build/original-editor-framework-evidence
      EDITOR_WORK: build/original-editor-framework-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use the original native ARM64 Python contract
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Bind original app sources resources packages and the additive target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_APP_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git switch --force-create "$EXPECTED_APP_BRANCH" "$GITHUB_SHA"
          python3 Tools/OriginalEditor/run_framework_acceptance.py --root "$GITHUB_WORKSPACE" \
            --evidence "$EDITOR_EVIDENCE" --work "$EDITOR_WORK" --source-only
          python3 Tools/OriginalEditor/admit_retained_source_controls.py --root "$GITHUB_WORKSPACE" --evidence "$EDITOR_EVIDENCE" \
            > "$EDITOR_EVIDENCE/retained-source-controls.stdout.log" 2> "$EDITOR_EVIDENCE/retained-source-controls.stderr.log"
      - name: Checkout the immutable original canonical Hanlin source
        uses: actions/checkout@v4
        with:
          repository: davidpovarsky/hanlin-ai
          ref: 4138ad87d9dab0a8970acf3968a2af89c1c67047
          path: .ci/hanlin-source
          persist-credentials: false
      - name: Prepare and verify the original SDK snapshot
        run: |
          python3 Tools/Hanlin/prepare_sdk.py --source .ci/hanlin-source
          python3 Tools/Hanlin/prepare_sdk.py --check
      - name: Verify actual Xcode27 and create original owned OS27 simulators
        run: python3 Tools/PinkhaSimulatorGate/preflight.py --evidence "$EDITOR_EVIDENCE/preflight"
      - name: Verify the recorded original Heart producer and exact binary slices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 Tools/Hanlin/prepare_original_editor_heart.py \
            --source-run-id "$HEART_SOURCE_RUN_ID" \
            --output build/original-editor-framework-verified-heart --evidence "$EDITOR_EVIDENCE/heart-source"
          python3 Tools/PinkhaNativeDerived/install_verified_heart.py \
            --archive build/original-editor-framework-verified-heart/Pinkha-Universal-Verified-Heart-r14.tar.gz \
            --inventory docs/pinkha/torah-integration/evidence/native-derived/8494cfb347/approval/revision-14/native-heart-integration.json \
            --patch docs/pinkha/torah-integration/evidence/native-derived/8494cfb347/approval/revision-14/native-heart-integration.patch \
            --app-source "$GITHUB_WORKSPACE" --source-run-id "$HEART_SOURCE_RUN_ID" \
            --expected-app-branch "$EXPECTED_APP_BRANCH" --evidence "$EDITOR_EVIDENCE/heart"
      - name: Approve only the exact reviewed Equatable compiler macro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 Tools/OriginalEditor/prepare_reviewed_macro.py --root "$GITHUB_WORKSPACE" \
            --evidence "$EDITOR_EVIDENCE/macro-trust"
      - name: Build the genuine framework and execute the separate binary consumer
        id: framework
        timeout-minutes: 120
        run: |
          python3 Tools/OriginalEditor/run_framework_acceptance.py --root "$GITHUB_WORKSPACE" \
            --evidence "$EDITOR_EVIDENCE" --work "$EDITOR_WORK"
      - name: Verify unique shared implementations and the complete Host module closure
        id: shared_runtime
        run: |
          python3 Tools/OriginalEditor/SharedRuntime/verify_framework_ownership.py --root "$GITHUB_WORKSPACE" \
            --evidence "$EDITOR_EVIDENCE" --work "$EDITOR_WORK"
      - name: Retain dependency-unqualified outputs if the new ownership gate fails
        if: failure() && steps.framework.outcome == 'success' && steps.shared_runtime.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Otzaria-Original-Editor-Dependency-Unqualified-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EDITOR_WORK }}/distribution
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Identify this producer's separately retained signed consumer
        if: always()
        id: retained_consumer
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'Tools/OriginalEditor')
          from framework_consumer_retention import current_producers
          root = Path(os.environ['EDITOR_WORK']) / 'retained-consumer'
          manifest = root / 'consumer-app-retention.json'
          available = False
          if manifest.is_file():
              retained = json.loads(manifest.read_bytes())
              source = json.loads((Path(os.environ['EDITOR_EVIDENCE']) / 'source-before.json').read_bytes())
              consumer, framework = current_producers(source, os.environ)
              assert retained['schema'] == 1 and retained['status'] == 'SIGNED_CONSUMER_RETAINED_WITHOUT_RUNTIME_QUALIFICATION'
              assert retained['runtime_qualified'] is False and retained['restore_as_original_sdk_allowed'] is False
              assert retained['consumer_producer'] == consumer and retained['framework_producer'] == framework
              assert retained['archive_name'] == 'consumer-app.zip'
              archive = root / retained['archive_name']
              assert archive.stat().st_size == retained['archive_bytes']
              with archive.open('rb') as stream: assert hashlib.file_digest(stream, 'sha256').hexdigest() == retained['archive_sha256']
              assert hashlib.sha256((root / 'consumer-app-inventory.json').read_bytes()).hexdigest() == retained['consumer_inventory_sha256']
              available = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('available=' + str(available).lower() + '\n')
          PYCODE
      - name: Upload this producer's unqualified signed consumer bytes
        if: always() && steps.retained_consumer.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Otzaria-Original-Editor-Signed-Consumer-Unqualified-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EDITOR_WORK }}/retained-consumer/consumer-app.zip
            ${{ env.EDITOR_WORK }}/retained-consumer/consumer-app-inventory.json
            ${{ env.EDITOR_WORK }}/retained-consumer/consumer-app-retention.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Restore only this run's exact macro approval afterimage
        if: always()
        run: |
          python3 Tools/OriginalEditor/prepare_reviewed_macro.py --root "$GITHUB_WORKSPACE" \
            --evidence "$EDITOR_EVIDENCE/macro-trust" --restore
      - name: Preserve actual source input command build and runtime evidence
        if: always()
        run: |
          mkdir -p "$EDITOR_EVIDENCE"
          python3 Tools/PinkhaNativeDerived/package_evidence.py "$EDITOR_EVIDENCE"
      - name: Upload source-bound framework acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Otzaria-Original-Editor-Framework-Evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EDITOR_EVIDENCE }}/Pinkha-Native-Derived-Evidence.zip
          if-no-files-found: error
          retention-days: 14
      - name: Retain unqualified producer outputs for an explicitly admitted continuation
        id: retain_unqualified
        if: always() && steps.framework.outcome == 'failure'
        run: |
          python3 Tools/OriginalEditor/retain_unqualified_products.py --root "$GITHUB_WORKSPACE" \
            --evidence "$EDITOR_EVIDENCE" --work "$EDITOR_WORK"
          if test -f "$EDITOR_WORK/UNQUALIFIED_PRODUCER.json"; then
            echo "retained=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload unqualified producer outputs without SDK acceptance
        if: always() && steps.retain_unqualified.outputs.retained == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Otzaria-Original-Editor-Unqualified-Producer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EDITOR_WORK }}/distribution
            ${{ env.EDITOR_WORK }}/UNQUALIFIED_PRODUCER.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload only the actually qualified simulator framework closure
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Otzaria-Original-Editor-Simulator-Framework-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EDITOR_WORK }}/distribution
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
