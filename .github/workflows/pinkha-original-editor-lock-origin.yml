name: Original editor observed package origin refresh

on:
  push:
    branches:
      - codex/otzaria-original-editor-lock-origin-20261122

permissions:
  contents: read
  actions: read

concurrency:
  group: original-editor-lock-origin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe-lock-origin:
    if: github.repository == 'davidpovarsky/anytype-swift' && github.event_name == 'push' && github.ref == 'refs/heads/codex/otzaria-original-editor-lock-origin-20261122'
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      LOCK_EVIDENCE: build/original-editor-lock-origin-evidence
      EXPECTED_APP_BRANCH: codex/otzaria-original-editor-lock-origin-20261122
    steps:
      - name: Checkout exact resolver source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable canonical Hanlin manifests
        uses: actions/checkout@v4
        with:
          repository: davidpovarsky/hanlin-ai
          ref: e00498e33f106cc43be0476ffa2e09329c8ca300
          path: build/original-editor-lock-hanlin-source
          persist-credentials: false
      - name: Prepare and verify original SDK snapshot
        run: |
          python3 Tools/Hanlin/prepare_sdk.py --source build/original-editor-lock-hanlin-source
          python3 Tools/Hanlin/prepare_sdk.py --check
      - name: Verify exact original Heart binary required by package manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git switch --force-create "$EXPECTED_APP_BRANCH" "$GITHUB_SHA"
          python3 Tools/Hanlin/prepare_original_editor_heart.py \
            --source-run-id 44203168617 \
            --output build/original-editor-lock-verified-heart --evidence build/original-editor-lock-heart-evidence/source
          python3 Tools/PinkhaNativeDerived/install_verified_heart.py \
            --archive build/original-editor-lock-verified-heart/Pinkha-Universal-Verified-Heart-r14.tar.gz \
            --inventory docs/pinkha/torah-integration/evidence/native-derived/8494cfb347/approval/revision-14/native-heart-integration.json \
            --patch docs/pinkha/torah-integration/evidence/native-derived/8494cfb347/approval/revision-14/native-heart-integration.patch \
            --app-source "$GITHUB_WORKSPACE" --source-run-id 44203168617 \
            --expected-app-branch "$EXPECTED_APP_BRANCH" --evidence build/original-editor-lock-heart-evidence/install
      - name: Observe actual resolver metadata and recheck frozen pins
        run: python3 Tools/OriginalEditor/refresh_package_origin.py
      - name: Retain exact before after command and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Original-Editor-Lock-Origin-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.LOCK_EVIDENCE }}
            build/original-editor-lock-heart-evidence
          if-no-files-found: error
          retention-days: 14
