name: Current Page154 App and mounted UI continuation

on:
  workflow_call: {}

permissions:
  contents: read
  actions: read

jobs:
  current-page154-mounted:
    runs-on: [self-hosted, macOS, ARM64, pinkha-scaleway-mac]
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_OPTIONAL_LOCKS: '0'
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: build/current-page154-${{ github.run_id }}-${{ github.run_attempt }}/evidence
    steps:
      - name: Checkout the exact current Page154 App and controller source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the dispatched local branch without advancing its commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/$GITHUB_REF_NAME"
          test "$GITHUB_REF_NAME" = "codex/chatgpt-wave15-shared-20261121"
          current_branch="$(git branch --show-current)"
          if [ -z "$current_branch" ]; then
            git switch -c "$GITHUB_REF_NAME"
          else
            test "$current_branch" = "$GITHUB_REF_NAME"
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Select installed native ARM64 Python 3.12
        shell: bash
        run: |
          pinkha_python_bin=/opt/homebrew/opt/python@3.12/libexec/bin
          "$pinkha_python_bin/python3" -I -c 'import platform, sys; assert sys.version_info[:2] == (3, 12), sys.version; assert platform.machine() == "arm64", platform.machine(); assert platform.system() == "Darwin", platform.system(); print(sys.version.split()[0], platform.machine(), sys.executable)'
          printf '%s\n' "$pinkha_python_bin" >> "$GITHUB_PATH"
      - name: Checkout the exact public canonical Hanlin source
        uses: actions/checkout@v4
        with:
          repository: davidpovarsky/hanlin-ai
          ref: 6bd6036dbca16c969689a5722550a54bebc1e851
          path: .ci/hanlin-source
          persist-credentials: false
      - name: Build current App and UI once, then execute necessary setup and the one failed journey
        id: execute
        timeout-minutes: 130
        shell: bash
        run: |
          set -euo pipefail
          python3 -B Tools/CurrentAppleValidation/page154_current.py execute --expected-source "$GITHUB_SHA" --inventory-recovery owned-inventory-timeout-v1
      - name: Finalize only journaled current-run resources even after failure
        if: ${{ always() && steps.execute.outcome != 'skipped' }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          python3 -B Tools/CurrentAppleValidation/page154_current.py cleanup --expected-source "$GITHUB_SHA" --inventory-recovery owned-inventory-timeout-v1
      - name: Preserve current App and UI Products, original results, private diagnostics and cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Current-Page154-Mounted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE }}
          retention-days: 30
          if-no-files-found: error
