name: Same source T5 Apple r14 r15 account pair

on:
  workflow_call:
    inputs:
      include_freshness:
        description: After four passing compatibility phases run bounded host freshness in a fifth process
        type: boolean
        default: false
      heart_r14_run_id:
        type: string
        required: true
      heart_r15_run_id:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  actual-apple-pair:
    runs-on: xcode-27
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - name: Checkout exact published application and controller source
        uses: actions/checkout@v4
      - name: Checkout immutable native approval inventories
        uses: actions/checkout@v4
        with:
          ref: 947fbde24d5657d0e1229f45bb3993648884a8a1
          path: build/t5-apple-native-source
          persist-credentials: false
      - name: Select native ARM64 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Checkout the canonical Hanlin SDK source
        uses: actions/checkout@v4
        with:
          repository: davidpovarsky/hanlin-ai
          ref: 116cc6be0654a5d11bc56ba00e0310031107ee36
          path: .ci/hanlin-source
          persist-credentials: false
      - name: Prepare and verify the exact SDK dependency
        run: |
          python3 Tools/Hanlin/prepare_sdk.py --source .ci/hanlin-source
          python3 Tools/Hanlin/prepare_sdk.py --check
          mkdir -p build/t5-apple-pair-proof
          cp Dependencies/Hanlin/.pinkha-source.json build/t5-apple-pair-proof/hanlin-snapshot.json
      - name: Check rejection controls without claiming Apple execution
        run: |
          python3 -B -m unittest discover -s Tools/PinkhaSimulatorGate -p 'test_t5_apple_pair*.py' -v > build/t5-apple-pair-proof/controller-controls.log 2>&1
          cat build/t5-apple-pair-proof/controller-controls.log
      - name: Verify actual Xcode27 and create fresh owned OS27 simulators
        run: python3 Tools/PinkhaSimulatorGate/preflight.py --evidence build/t5-apple-pair-proof/preflight
      - name: Restore compatible compilation inputs
        id: pair-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ui27-derived
          key: pinkha-t5-apple-pair-arm64-xcode27-Release-Anytype-${{ hashFiles('Modules/PinkhaKit/Package.swift', 'Anytype.xcodeproj/project.pbxproj', 'Anytype.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Tools/Hanlin/source.json') }}-${{ github.sha }}
          restore-keys: |
            pinkha-t5-apple-pair-arm64-xcode27-Release-Anytype-${{ hashFiles('Modules/PinkhaKit/Package.swift', 'Anytype.xcodeproj/project.pbxproj', 'Anytype.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Tools/Hanlin/source.json') }}-
            pinkha-ui27-arm64-xcode27.0-Release-Anytype-${{ hashFiles('Modules/PinkhaKit/Package.swift', 'Anytype.xcodeproj/project.pbxproj', 'Anytype.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Tools/Hanlin/source.json') }}-
      - name: Build the same source twice and run the four native account phases
        id: actual-pair
        env:
          GH_TOKEN: ${{ github.token }}
          HEART_R14_RUN_ID: ${{ inputs.heart_r14_run_id }}
          HEART_R15_RUN_ID: ${{ inputs.heart_r15_run_id }}
          INCLUDE_FRESHNESS: ${{ inputs.include_freshness && 'true' || 'false' }}
        run: |
          set --
          case "$INCLUDE_FRESHNESS" in
            true) set -- --include-freshness ;;
            false) ;;
            *) echo "Explicit true/false freshness mode required" >&2; exit 1 ;;
          esac
          python3 -B Tools/PinkhaSimulatorGate/run_t5_apple_pair.py \
            --app "$GITHUB_WORKSPACE" --native-source build/t5-apple-native-source \
            --work build/t5-apple-pair-private --evidence build/t5-apple-pair-proof \
            --derived build/ui27-derived \
            --heart-r14-run-id "$HEART_R14_RUN_ID" --heart-r15-run-id "$HEART_R15_RUN_ID" "$@"
      - name: Keep XCTest activity logs out of the compilation cache
        if: always()
        id: cache-log-boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shutil
          logs = Path("build/ui27-derived/Logs")
          private = Path("build/t5-apple-pair-private/unpublished-derived-logs")
          proof = Path("build/t5-apple-pair-proof")
          proof.mkdir(parents=True, exist_ok=True)
          moved = False
          if logs.exists():
              if private.exists():
                  raise RuntimeError("Refuse to overwrite private native cache logs")
              private.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(logs), private)
              moved = True
          (proof / "cache-log-boundary.json").write_text(json.dumps({
              "status": "PASS", "derived_activity_logs_moved_to_private_work": moved,
              "private_work_cached": False, "account_data_cached": False
          }, indent=2) + "\n")
          PY
      - name: Package only approved proof and secret-scanned native logs
        if: always()
        run: |
          mkdir -p build/t5-apple-pair-proof
          python3 Tools/PinkhaNativeDerived/package_evidence.py build/t5-apple-pair-proof
      - name: Retain source and actual XCTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pinkha-T5-Apple-Pair-Evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/t5-apple-pair-proof/Pinkha-Native-Derived-Evidence.zip
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compilation cache under the separate test flag key
        if: ${{ always() && steps.cache-log-boundary.outcome == 'success' && steps.actual-pair.outcome != 'skipped' && steps.pair-cache.outputs.cache-hit != 'true' && hashFiles('build/ui27-derived/Build/PinkhaSourceInputs.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: build/ui27-derived
          key: ${{ steps.pair-cache.outputs.cache-primary-key }}
