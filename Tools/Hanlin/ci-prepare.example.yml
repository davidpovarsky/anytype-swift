# Insert AFTER the Anytype checkout and BEFORE package resolution or xcodebuild.
- name: Read the canonical SDK lock
  id: hanlin-pin
  run: python3 Tools/Hanlin/prepare_sdk.py --github-output "$GITHUB_OUTPUT"
- name: Checkout immutable public canonical Hanlin source
  uses: actions/checkout@v4
  with:
    repository: davidpovarsky/hanlin-ai
    ref: ${{ steps.hanlin-pin.outputs.revision }}
    path: .ci/hanlin-source
    persist-credentials: false
- name: Prepare one canonical selected Hanlin profile
  run: |
    python3 Tools/Hanlin/prepare_sdk.py --source .ci/hanlin-source
    python3 Tools/Hanlin/prepare_sdk.py --check
