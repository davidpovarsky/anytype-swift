# Insert AFTER the Anytype checkout and BEFORE package resolution or xcodebuild.
# hanlin-ai is public; no additional secret or writable token is required.
- name: Checkout pinned canonical Hanlin source
  uses: actions/checkout@v4
  with:
    repository: davidpovarsky/hanlin-ai
    ref: 6bd6036dbca16c969689a5722550a54bebc1e851
    path: .ci/hanlin-source
    persist-credentials: false

- name: Prepare canonical nested Hanlin packages
  shell: bash
  run: |
    set -euo pipefail
    python3 Tools/Hanlin/prepare_sdk.py --source .ci/hanlin-source
    python3 Tools/Hanlin/prepare_sdk.py --check
